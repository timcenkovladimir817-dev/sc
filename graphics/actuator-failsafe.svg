<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="860" height="400" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#15243e">Привод и безопасное положение: важна схема, а не только надпись</text>
  <text x="24" y="50" font-size="12" fill="#5b6b82">Потеря воздуха, питания и сигнала — разные отказы; положение проверяют для каждого</text>

  <!-- left: diaphragm -->
  <rect x="24" y="72" width="360" height="270" rx="12" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="204" y="98" font-size="14" font-weight="700" text-anchor="middle" fill="#15243e">Мембранный пружинный привод</text>
  <path d="M110 135 Q204 90 298 135 L298 185 Q204 230 110 185 Z" fill="#dbeafe" stroke="#315de0" stroke-width="2"/>
  <line x1="110" y1="185" x2="298" y2="185" stroke="#315de0" stroke-width="2"/>
  <path d="M150 190 L258 190 M160 210 L248 210 M172 230 L236 230" stroke="#64748b" stroke-width="3"/>
  <rect x="196" y="185" width="16" height="100" fill="#334155"/>
  <text x="204" y="300" font-size="11" text-anchor="middle" fill="#5b6b82">давление воздуха ⇄ пружина</text>
  <text x="204" y="320" font-size="11" text-anchor="middle" fill="#5b6b82">при потере воздуха пружина двигает шток</text>

  <!-- right: matrix -->
  <rect x="410" y="72" width="426" height="270" rx="12" fill="#ffffff" stroke="#dbe3ef"/>
  <text x="623" y="98" font-size="14" font-weight="700" text-anchor="middle" fill="#15243e">Матрица отказов</text>
  <g font-size="11" fill="#15243e">
    <rect x="430" y="116" width="386" height="30" fill="#eef3fd" stroke="#cbd5e1"/>
    <text x="442" y="136">Отказ</text><text x="610" y="136">Что проверить</text>
    <rect x="430" y="146" width="386" height="34" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="442" y="167">потеря воздуха</text><text x="610" y="167">пружина, усилие, ход</text>
    <rect x="430" y="180" width="386" height="34" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="442" y="201">потеря питания</text><text x="610" y="201">электропривод, резерв</text>
    <rect x="430" y="214" width="386" height="34" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="442" y="235">потеря сигнала</text><text x="610" y="235">позиционер, соленоид</text>
    <rect x="430" y="248" width="386" height="34" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="442" y="269">отказ позиционера</text><text x="610" y="269">механика, обратная связь</text>
  </g>
  <text x="623" y="316" font-size="10" text-anchor="middle" fill="#5b6b82">Fail-open / fail-close / fail-in-place — только для конкретного отказа</text>

  <text x="24" y="378" font-size="11" fill="#5b6b82">Надпись на бирке не заменяет проверку фактического положения и времени срабатывания.</text>
</svg>
