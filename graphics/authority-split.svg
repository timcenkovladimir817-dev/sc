<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="340" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" font-weight="700" fill="#15243e">Как авторитет делит расчётный перепад</text>
  <text x="24" y="48" font-size="12" fill="#5b6b82">Клапан и остальной контур при одном и том же расчётном расходе</text>

  <g font-size="13" fill="#15243e">
    <text x="24" y="96">a = 0,1</text>
    <text x="24" y="146">a = 0,2</text>
    <text x="24" y="196">a = 0,3</text>
    <text x="24" y="246">a = 0,5</text>
  </g>

  <!-- a=0.1 -->
  <rect x="110" y="78" width="40" height="30" fill="#dc2626"/>
  <rect x="150" y="78" width="360" height="30" fill="#16a34a"/>
  <text x="130" y="99" font-size="11" text-anchor="middle" fill="#ffffff">10 %</text>
  <text x="330" y="99" font-size="11" text-anchor="middle" fill="#ffffff">90 %</text>

  <!-- a=0.2 -->
  <rect x="110" y="128" width="80" height="30" fill="#dc2626"/>
  <rect x="190" y="128" width="320" height="30" fill="#16a34a"/>
  <text x="150" y="149" font-size="11" text-anchor="middle" fill="#ffffff">20 %</text>
  <text x="350" y="149" font-size="11" text-anchor="middle" fill="#ffffff">80 %</text>

  <!-- a=0.3 -->
  <rect x="110" y="178" width="120" height="30" fill="#dc2626"/>
  <rect x="230" y="178" width="280" height="30" fill="#16a34a"/>
  <text x="170" y="199" font-size="11" text-anchor="middle" fill="#ffffff">30 %</text>
  <text x="370" y="199" font-size="11" text-anchor="middle" fill="#ffffff">70 %</text>

  <!-- a=0.5 -->
  <rect x="110" y="228" width="200" height="30" fill="#dc2626"/>
  <rect x="310" y="228" width="200" height="30" fill="#16a34a"/>
  <text x="210" y="249" font-size="11" text-anchor="middle" fill="#ffffff">50 %</text>
  <text x="410" y="249" font-size="11" text-anchor="middle" fill="#ffffff">50 %</text>

  <!-- легенда -->
  <rect x="110" y="282" width="14" height="14" fill="#dc2626"/>
  <text x="132" y="294" font-size="12" fill="#15243e">доля клапана Δp v,100</text>
  <rect x="330" y="282" width="14" height="14" fill="#16a34a"/>
  <text x="352" y="294" font-size="12" fill="#15243e">доля остального контура Δp rest</text>
  <text x="110" y="318" font-size="11" fill="#5b6b82">Чем меньше красная часть, тем слабее клапан влияет на расход</text>
  <text x="110" y="334" font-size="11" fill="#5b6b82">и тем сильнее искажается его характеристика.</text>
</svg>
