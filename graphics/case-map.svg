<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#15243e">Пять случаев практикума: одна логика, разные ловушки</text>
  <text x="24" y="50" font-size="12" fill="#5b6b82">Сначала факты и различающая проверка, затем гипотеза, и только потом вмешательство</text>

  <g font-size="12" fill="#15243e">
    <rect x="36" y="82" width="256" height="150" rx="10" fill="#eef3fd" stroke="#315de0"/>
    <text x="164" y="108" text-anchor="middle" font-weight="700">1. Не перекрывает поток</text>
    <text x="164" y="132" text-anchor="middle">байпас? ход? усилие?</text>
    <text x="164" y="152" text-anchor="middle">седло? направление?</text>
    <text x="164" y="180" text-anchor="middle" font-size="11" fill="#1e3a8a">ловушка: сразу заказать</text>
    <text x="164" y="198" text-anchor="middle" font-size="11" fill="#1e3a8a">седло без проверки пути</text>
    <text x="164" y="216" text-anchor="middle" font-size="11" fill="#1e3a8a">утечки</text>

    <rect x="322" y="82" width="256" height="150" rx="10" fill="#fff7ed" stroke="#d97706"/>
    <text x="450" y="108" text-anchor="middle" font-weight="700">2. Колебания после</text>
    <text x="450" y="128" text-anchor="middle">замены набивки</text>
    <text x="450" y="152" text-anchor="middle">трение? люфт? настройка?</text>
    <text x="450" y="180" text-anchor="middle" font-size="11" fill="#9a5b00">ловушка: увеличить</text>
    <text x="450" y="198" text-anchor="middle" font-size="11" fill="#9a5b00">обжатие и «дожать»</text>
    <text x="450" y="216" text-anchor="middle" font-size="11" fill="#9a5b00">привод</text>

    <rect x="608" y="82" width="256" height="150" rx="10" fill="#e8f6ec" stroke="#16a34a"/>
    <text x="736" y="108" text-anchor="middle" font-weight="700">3. Течь по фланцу</text>
    <text x="736" y="128" text-anchor="middle">прокладка? поверхность?</text>
    <text x="736" y="152" text-anchor="middle">затяжка? перекос?</text>
    <text x="736" y="180" text-anchor="middle" font-size="11" fill="#166534">ловушка: тянуть</text>
    <text x="736" y="198" text-anchor="middle" font-size="11" fill="#166534">сильнее без осмотра</text>
    <text x="736" y="216" text-anchor="middle" font-size="11" fill="#166534">поверхности</text>

    <rect x="180" y="258" width="256" height="150" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="308" y="284" text-anchor="middle" font-weight="700">4. Пропуск после ремонта</text>
    <text x="308" y="304" text-anchor="middle">трим? сборка? усилие?</text>
    <text x="308" y="328" text-anchor="middle">испытание? документы?</text>
    <text x="308" y="356" text-anchor="middle" font-size="11" fill="#991b1b">ловушка: считать</text>
    <text x="308" y="374" text-anchor="middle" font-size="11" fill="#991b1b">«приработается» или</text>
    <text x="308" y="392" text-anchor="middle" font-size="11" fill="#991b1b">перенести критерий</text>

    <rect x="464" y="258" width="256" height="150" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="592" y="284" text-anchor="middle" font-weight="700">5. Шум и вибрация</text>
    <text x="592" y="304" text-anchor="middle">кавитация? вскипание?</text>
    <text x="592" y="328" text-anchor="middle">резонанс? крепление?</text>
    <text x="592" y="356" text-anchor="middle" font-size="11" fill="#5b21b6">ловушка: лечить</text>
    <text x="592" y="374" text-anchor="middle" font-size="11" fill="#5b21b6">только трим, не меняя</text>
    <text x="592" y="392" text-anchor="middle" font-size="11" fill="#5b21b6">режим и схему</text>
  </g>

  <rect x="36" y="432" width="828" height="56" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="56" y="456" font-size="12" fill="#334155" font-weight="700">Общий каркас разбора: факты → гипотезы → различающая проверка → решение → запись результата.</text>
  <text x="56" y="476" font-size="12" fill="#334155">Различие случаев — в том, какая проверка отделяет конкурирующие объяснения.</text>

  <text x="24" y="514" font-size="11" fill="#5b6b82">Практикум не заменяет проектную документацию и процедуры объекта; он тренирует порядок мышления.</text>
</svg>
