<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Arial, Helvetica, sans-serif">
  <rect width="820" height="380" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#15243e">Давление внутри клапана: где возникает кавитация и вскипание</text>
  <text x="24" y="50" font-size="12" fill="#5b6b82">P1 и P2 — только границы участка; минимальное давление Pvc находится внутри сужения</text>

  <line x1="70" y1="300" x2="760" y2="300" stroke="#667" stroke-width="2"/>
  <line x1="70" y1="80" x2="70" y2="300" stroke="#667" stroke-width="2"/>
  <text x="24" y="86" font-size="12" fill="#5b6b82">p</text>
  <text x="748" y="322" font-size="12" fill="#5b6b82">путь</text>

  <polyline points="70,110 250,110 330,245 390,245 470,150 760,150" fill="none" stroke="#315de0" stroke-width="3"/>
  <line x1="70" y1="220" x2="760" y2="220" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="700" y="212" font-size="12" fill="#dc2626">Pv</text>

  <circle cx="330" cy="245" r="5" fill="#315de0"/>
  <text x="300" y="270" font-size="12" fill="#15243e">Pvc</text>
  <text x="86" y="102" font-size="12" fill="#15243e">P1</text>
  <text x="640" y="142" font-size="12" fill="#15243e">P2</text>

  <rect x="300" y="255" width="120" height="34" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="360" y="277" font-size="11" text-anchor="middle" fill="#991b1b">Pvc ниже Pv</text>
  <rect x="520" y="95" width="190" height="54" rx="8" fill="#eff6ff" stroke="#315de0"/>
  <text x="615" y="116" font-size="11" text-anchor="middle" fill="#1e3a8a">если P2 выше Pv —</text>
  <text x="615" y="134" font-size="11" text-anchor="middle" fill="#1e3a8a">пузырьки схлопываются</text>
  <rect x="520" y="165" width="190" height="42" rx="8" fill="#fff7ed" stroke="#d97706"/>
  <text x="615" y="191" font-size="11" text-anchor="middle" fill="#9a5b00">если P2 ниже Pv — вскипание</text>

  <text x="24" y="360" font-size="11" fill="#5b6b82">Схема условная: реальный профиль зависит от конструкции, FL, расхода и свойств среды.</text>
</svg>
