<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" font-weight="700" fill="#15243e">Как арматуру соединяют с трубой</text>
  <text x="24" y="48" font-size="12" fill="#5b6b82">Три основных способа: разъёмный, резьбовой и неразъёмный</text>

  <!-- Фланцевое -->
  <rect x="20" y="70" width="210" height="280" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="125" y="96" font-size="14" font-weight="700" text-anchor="middle" fill="#15243e">Фланцевое</text>
  <line x1="40" y1="175" x2="90" y2="175" stroke="#94a3b8" stroke-width="12"/>
  <line x1="160" y1="175" x2="210" y2="175" stroke="#94a3b8" stroke-width="12"/>
  <rect x="88" y="135" width="14" height="80" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <rect x="148" y="135" width="14" height="80" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <g fill="#334155">
    <circle cx="95" cy="150" r="4"/><circle cx="95" cy="200" r="4"/>
    <circle cx="155" cy="150" r="4"/><circle cx="155" cy="200" r="4"/>
  </g>
  <line x1="102" y1="150" x2="148" y2="150" stroke="#334155" stroke-width="2"/>
  <line x1="102" y1="200" x2="148" y2="200" stroke="#334155" stroke-width="2"/>
  <text x="125" y="250" font-size="11" text-anchor="middle" fill="#15243e">Два диска стянуты болтами.</text>
  <text x="125" y="268" font-size="11" text-anchor="middle" fill="#15243e">Можно разобрать.</text>
  <text x="125" y="286" font-size="10" text-anchor="middle" fill="#5b6b82">Нужно совпадение DN и PN.</text>

  <!-- Муфтовое -->
  <rect x="250" y="70" width="210" height="280" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="355" y="96" font-size="14" font-weight="700" text-anchor="middle" fill="#15243e">Муфтовое</text>
  <line x1="270" y1="175" x2="330" y2="175" stroke="#94a3b8" stroke-width="12"/>
  <line x1="380" y1="175" x2="440" y2="175" stroke="#94a3b8" stroke-width="12"/>
  <rect x="328" y="162" width="54" height="26" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="336" y1="164" x2="336" y2="186"/>
    <line x1="344" y1="164" x2="344" y2="186"/>
    <line x1="352" y1="164" x2="352" y2="186"/>
    <line x1="360" y1="164" x2="360" y2="186"/>
    <line x1="368" y1="164" x2="368" y2="186"/>
    <line x1="376" y1="164" x2="376" y2="186"/>
  </g>
  <text x="355" y="250" font-size="11" text-anchor="middle" fill="#15243e">Резьба, как у водопроводного крана.</text>
  <text x="355" y="268" font-size="11" text-anchor="middle" fill="#15243e">Удобно на малых диаметрах.</text>
  <text x="355" y="286" font-size="10" text-anchor="middle" fill="#5b6b82">Не любит изгибающих нагрузок.</text>

  <!-- Приварное -->
  <rect x="480" y="70" width="220" height="280" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="590" y="96" font-size="14" font-weight="700" text-anchor="middle" fill="#15243e">Приварное</text>
  <line x1="500" y1="175" x2="565" y2="175" stroke="#94a3b8" stroke-width="12"/>
  <line x1="615" y1="175" x2="680" y2="175" stroke="#94a3b8" stroke-width="12"/>
  <path d="M565 160 L575 167 L565 174 L575 181 L565 188 L575 195" fill="none" stroke="#dc2626" stroke-width="3"/>
  <path d="M615 160 L605 167 L615 174 L605 181 L615 188 L605 195" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="590" y="250" font-size="11" text-anchor="middle" fill="#15243e">Самый прочный и неразъёмный.</text>
  <text x="590" y="268" font-size="11" text-anchor="middle" fill="#15243e">Нужен сварщик и контроль шва.</text>
  <text x="590" y="286" font-size="10" text-anchor="middle" fill="#5b6b82">Для ответственных участков.</text>

  <text x="24" y="380" font-size="11" fill="#5b6b82">Фланцы должны совпадать не только по DN, но и по PN и стандарту — иначе соединение не соберётся герметично.</text>
</svg>
