<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" font-weight="700" fill="#15243e">DN и PN на пальцах</text>
  <text x="24" y="48" font-size="12" fill="#5b6b82">Номинальный размер и класс давления — разные вещи</text>

  <!-- левая панель -->
  <rect x="20" y="70" width="290" height="290" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="165" y="96" font-size="14" font-weight="700" text-anchor="middle" fill="#15243e">DN — условный проход</text>

  <circle cx="165" cy="205" r="72" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="165" cy="205" r="56" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="165" y="210" font-size="15" font-weight="700" text-anchor="middle" fill="#15243e">DN 50</text>

  <line x1="93" y1="205" x2="237" y2="205" stroke="#315de0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="93" y1="198" x2="93" y2="212" stroke="#315de0" stroke-width="1.5"/>
  <line x1="237" y1="198" x2="237" y2="212" stroke="#315de0" stroke-width="1.5"/>
  <text x="165" y="160" font-size="10" text-anchor="middle" fill="#315de0">наружный ≈ 57 мм</text>

  <text x="165" y="300" font-size="11" text-anchor="middle" fill="#15243e">Это номинальная метка для совместимости,</text>
  <text x="165" y="318" font-size="11" text-anchor="middle" fill="#15243e">а не точный внутренний диаметр.</text>
  <text x="165" y="340" font-size="10" text-anchor="middle" fill="#5b6b82">Внутренний зависит от толщины стенки.</text>

  <!-- правая панель -->
  <rect x="330" y="70" width="290" height="290" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="475" y="96" font-size="14" font-weight="700" text-anchor="middle" fill="#15243e">PN — класс давления</text>

  <!-- оси -->
  <line x1="370" y1="130" x2="370" y2="300" stroke="#667" stroke-width="1.5"/>
  <line x1="370" y1="300" x2="590" y2="300" stroke="#667" stroke-width="1.5"/>
  <text x="480" y="324" font-size="10" text-anchor="middle" fill="#5b6b82">температура</text>
  <text x="350" y="215" font-size="10" text-anchor="middle" fill="#5b6b82" transform="rotate(-90 350 215)">допустимое давление</text>

  <!-- кривая -->
  <path d="M380 150 C430 155 470 180 520 230 C545 255 565 275 580 288" fill="none" stroke="#dc2626" stroke-width="3"/>

  <rect x="500" y="120" width="76" height="30" rx="6" fill="#fde8e8" stroke="#dc2626"/>
  <text x="538" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#dc2626">PN 40</text>

  <text x="475" y="352" font-size="11" text-anchor="middle" fill="#15243e">PN 40 — это не «40 бар при любой температуре».</text>
  <text x="475" y="370" font-size="10" text-anchor="middle" fill="#5b6b82">С нагревом допустимое давление обычно снижается.</text>
</svg>
