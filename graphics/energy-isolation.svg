<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Arial, Helvetica, sans-serif">
  <rect width="880" height="460" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#15243e">Энергии узла: изолировать нужно каждую</text>
  <text x="24" y="50" font-size="12" fill="#5b6b82">Закрытая арматура снимает не все источники; ноль на манометре — не универсальное доказательство</text>

  <g font-size="12" fill="#15243e">
    <rect x="36" y="80" width="250" height="52" rx="9" fill="#fef2f2" stroke="#dc2626"/>
    <text x="56" y="104" font-weight="700">Давление среды</text>
    <text x="56" y="122">задвижки, заглушки, дренаж</text>

    <rect x="306" y="80" width="250" height="52" rx="9" fill="#fff7ed" stroke="#d97706"/>
    <text x="326" y="104" font-weight="700">Электропитание</text>
    <text x="326" y="122">отключение, блокировка, проверка</text>

    <rect x="576" y="80" width="268" height="52" rx="9" fill="#eef3fd" stroke="#315de0"/>
    <text x="596" y="104" font-weight="700">Управляющий воздух</text>
    <text x="596" y="122">сброс, запирание, остаточное давление</text>

    <rect x="36" y="152" width="250" height="52" rx="9" fill="#eef3fd" stroke="#315de0"/>
    <text x="56" y="176" font-weight="700">Гидравлика</text>
    <text x="56" y="194">аккумуляторы, линии, утечки</text>

    <rect x="306" y="152" width="250" height="52" rx="9" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="326" y="176" font-weight="700">Пружины и груз</text>
    <text x="326" y="194">накопленная механическая энергия</text>

    <rect x="576" y="152" width="268" height="52" rx="9" fill="#fff7ed" stroke="#d97706"/>
    <text x="596" y="176" font-weight="700">Температура</text>
    <text x="596" y="194">ожог, пар, тепловое расширение</text>
  </g>

  <rect x="36" y="236" width="808" height="120" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="56" y="264" font-size="13" font-weight="700" fill="#15243e">Порядок подтверждения безопасного состояния</text>
  <g font-size="12" fill="#334155">
    <text x="56" y="290">1. Определить все источники и границы работ по утверждённой процедуре.</text>
    <text x="56" y="312">2. Изолировать, заблокировать и обозначить; проверить отсутствие энергии допустимым способом.</text>
    <text x="56" y="334">3. Учесть остаточную среду, температуру и возможность повторного появления энергии.</text>
  </g>

  <rect x="36" y="376" width="808" height="56" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="56" y="400" font-size="12" fill="#991b1b" font-weight="700">Частая ошибка: считать, что «клапан закрыт» = «участок безопасен».</text>
  <text x="56" y="420" font-size="12" fill="#991b1b">Изоляция, дренаж, вентиляция и проверка — разные действия, и каждое должно быть выполнено.</text>

  <text x="24" y="452" font-size="11" fill="#5b6b82">Конкретный набор мер определяют процедуры объекта и наряд-допуск, а не этот учебный плакат.</text>
</svg>
