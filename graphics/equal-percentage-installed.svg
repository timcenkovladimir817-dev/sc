    <line x1="388" y1="122" x2="414" y2="122" stroke="#315de0" stroke-width="2.5"/>
    <text x="422" y="126">равнопроцентная, a = 1,0</text>
    <line x1="388" y1="152" x2="414" y2="152" stroke="#16a34a" stroke-width="2.5"/>
    <text x="422" y="156">равнопроцентная, a = 0,5</text>
    <line x1="388" y1="182" x2="414" y2="182" stroke="#d97706" stroke-width="2.5"/>
    <text x="422" y="186">равнопроцентная, a = 0,2</text>
  </g>
  <g font-size="11" fill="#5b6b82">
    <text x="388" y="226">При a = 1,0 половина хода даёт</text>
    <text x="388" y="242">всего 14 % расхода. При a = 0,2 —</text>
    <text x="388" y="258">уже 30 %, при a = 0,1 — 41 %.</text>
    <text x="388" y="282">Низкий авторитет «выпрямляет»</text>
    <text x="388" y="298">равнопроцентную кривую.</text>
  </g>
</svg>
