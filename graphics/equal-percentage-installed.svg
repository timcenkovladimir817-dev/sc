<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" font-weight="700" fill="#15243e">Равнопроцентная характеристика в системе</text>
  <text x="24" y="48" font-size="12" fill="#5b6b82">k = 50^(h − 1); q = 1 / √(a / k² + 1 − a)</text>

  <!-- сетка -->
  <g stroke="#dbe3ef" stroke-width="1">
    <line x1="80" y1="255" x2="360" y2="255"/>
    <line x1="80" y1="190" x2="360" y2="190"/>
    <line x1="80" y1="125" x2="360" y2="125"/>
    <line x1="150" y1="60" x2="150" y2="320"/>
    <line x1="220" y1="60" x2="220" y2="320"/>
    <line x1="290" y1="60" x2="290" y2="320"/>
  </g>
  <line x1="80" y1="60" x2="80" y2="320" stroke="#667" stroke-width="1.5"/>
  <line x1="80" y1="320" x2="360" y2="320" stroke="#667" stroke-width="1.5"/>

  <g font-size="11" fill="#5b6b82">
    <text x="74" y="325" text-anchor="end">0</text>
    <text x="74" y="260" text-anchor="end">0,25</text>
    <text x="74" y="195" text-anchor="end">0,50</text>
    <text x="74" y="130" text-anchor="end">0,75</text>
    <text x="74" y="65" text-anchor="end">1,00</text>
    <text x="80" y="338" text-anchor="middle">0</text>
    <text x="150" y="338" text-anchor="middle">0,25</text>
    <text x="220" y="338" text-anchor="middle">0,50</text>
    <text x="290" y="338" text-anchor="middle">0,75</text>
    <text x="360" y="338" text-anchor="middle">1,00</text>
  </g>
  <text x="220" y="362" font-size="12" text-anchor="middle" fill="#15243e">Относительный ход h</text>
  <text x="20" y="190" font-size="12" text-anchor="middle" fill="#15243e" transform="rotate(-90 20 190)">Относительный расход q</text>

