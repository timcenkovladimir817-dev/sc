  </g>
  <g font-size="11" fill="#5b6b82">
    <text x="388" y="226">Чем ниже авторитет, тем сильнее</text>
    <text x="388" y="242">расход уходит в начало хода:</text>
    <text x="388" y="266">при a = 0,1 и h = 0,5</text>
    <text x="388" y="282">q ≈ 0,88, то есть 88 %.</text>
  </g>
