  <rect width="640" height="400" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" font-weight="700" fill="#15243e">Установленная характеристика линейного клапана</text>
  <text x="24" y="48" font-size="12" fill="#5b6b82">q = 1 / √(a / k² + 1 − a), где k = h; q = Q / Q100</text>

  <!-- сетка -->
  <g stroke="#dbe3ef" stroke-width="1">
    <line x1="80" y1="255" x2="360" y2="255"/>
    <line x1="80" y1="190" x2="360" y2="190"/>
