    <text x="290" y="338" text-anchor="middle">0,75</text>
    <text x="360" y="338" text-anchor="middle">1,00</text>
  </g>
  <text x="220" y="362" font-size="12" text-anchor="middle" fill="#15243e">Относительный ход h</text>
  <text x="20" y="190" font-size="12" text-anchor="middle" fill="#15243e" transform="rotate(-90 20 190)">Относительный расход q</text>

