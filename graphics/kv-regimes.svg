<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Arial, Helvetica, sans-serif">
  <rect width="820" height="380" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#15243e">Три режима — один Kvs: проверка хода, а не только запаса</text>
  <text x="24" y="50" font-size="12" fill="#5b6b82">Полоса — требуемый Kv в режиме; красная линия — выбранный Kvs = 45</text>

  <!-- rows -->
  <text x="24" y="100" font-size="13" font-weight="700" fill="#15243e">Минимум</text>
  <text x="24" y="118" font-size="11" fill="#5b6b82">Q = 5 м³/ч · Δp = 2 бар</text>
  <rect x="250" y="93" width="24" height="24" rx="4" fill="#f59e0b"/>
  <text x="282" y="110" font-size="12" font-weight="700" fill="#9a5b00">Kv ≈ 3,5</text>
  <text x="560" y="110" font-size="11" fill="#b45309">ход ≈ 8 % · у седла</text>

  <text x="24" y="165" font-size="13" font-weight="700" fill="#15243e">Норма</text>
  <text x="24" y="183" font-size="11" fill="#5b6b82">Q = 20 м³/ч · Δp = 1 бар</text>
  <rect x="250" y="158" width="132" height="24" rx="4" fill="#315de0"/>
  <text x="390" y="175" font-size="12" font-weight="700" fill="#1e3a8a">Kv = 20</text>
  <text x="560" y="175" font-size="11" fill="#1e3a8a">ход ≈ 44 % · рабочий</text>

  <text x="24" y="230" font-size="13" font-weight="700" fill="#15243e">Максимум</text>
  <text x="24" y="248" font-size="11" fill="#5b6b82">Q = 30 м³/ч · Δp = 0,5 бар</text>
  <rect x="250" y="223" width="280" height="24" rx="4" fill="#16926a"/>
  <text x="520" y="240" font-size="12" font-weight="700" text-anchor="end" fill="#ffffff">Kv ≈ 42,4</text>
  <text x="560" y="240" font-size="11" fill="#047857">ход ≈ 94 % · почти открыт</text>

  <!-- Kvs line -->
  <line x1="547" y1="70" x2="547" y2="286" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="547" y="63" font-size="11" text-anchor="middle" fill="#dc2626">Kvs = 45</text>

  <!-- axis -->
  <line x1="250" y1="286" x2="575" y2="286" stroke="#667" stroke-width="1.5"/>
  <line x1="250" y1="286" x2="250" y2="291" stroke="#667"/>
  <line x1="349" y1="286" x2="349" y2="291" stroke="#667"/>
  <line x1="448" y1="286" x2="448" y2="291" stroke="#667"/>
  <line x1="547" y1="286" x2="547" y2="291" stroke="#667"/>
  <text x="250" y="304" font-size="10" text-anchor="middle" fill="#5b6b82">0</text>
  <text x="349" y="304" font-size="10" text-anchor="middle" fill="#5b6b82">15</text>
  <text x="448" y="304" font-size="10" text-anchor="middle" fill="#5b6b82">30</text>
  <text x="547" y="304" font-size="10" text-anchor="middle" fill="#5b6b82">45 Kv</text>

  <text x="24" y="338" font-size="11" fill="#5b6b82">Kvs = 45 формально покрывает максимум. Но минимум работает у седла, где люфт и трение сравнимы с щелью.</text>
  <text x="24" y="358" font-size="11" fill="#5b6b82">Поэтому проверяют ход во всех режимах по кривой Kv(h), а не только сравнивают Kvs с максимальным Kv.</text>
</svg>
