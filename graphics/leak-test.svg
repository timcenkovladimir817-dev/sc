<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Arial, Helvetica, sans-serif">
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#15243e">Три объекта проверки герметичности — три разных вывода</text>
  <text x="24" y="50" font-size="12" fill="#5b6b82">Исправный корпус не доказывает герметичность затвора, а отсутствие внешней течи — отсутствие внутреннего пропуска</text>

  <g font-size="12" fill="#15243e">
    <rect x="36" y="80" width="256" height="120" rx="10" fill="#eef3fd" stroke="#315de0"/>
    <text x="164" y="106" text-anchor="middle" font-weight="700">Прочность корпуса</text>
    <text x="164" y="128" text-anchor="middle">испытание давлением</text>
    <text x="164" y="150" text-anchor="middle">цель: нет разрушения</text>
    <text x="164" y="172" text-anchor="middle">и недопустимых деформаций</text>

    <rect x="312" y="80" width="256" height="120" rx="10" fill="#fff7ed" stroke="#d97706"/>
    <text x="440" y="106" text-anchor="middle" font-weight="700">Внешняя герметичность</text>
    <text x="440" y="128" text-anchor="middle">соединения, сальник, корпус</text>
    <text x="440" y="150" text-anchor="middle">цель: нет течи наружу</text>
    <text x="440" y="172" text-anchor="middle">при заданных условиях</text>

    <rect x="588" y="80" width="256" height="120" rx="10" fill="#e8f6ec" stroke="#16a34a"/>
    <text x="716" y="106" text-anchor="middle" font-weight="700">Герметичность затвора</text>
    <text x="716" y="128" text-anchor="middle">закрытый затвор</text>
    <text x="716" y="150" text-anchor="middle">цель: утечка не выше</text>
    <text x="716" y="172" text-anchor="middle">нормы для класса</text>
  </g>

  <rect x="36" y="224" width="808" height="130" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="56" y="252" font-size="13" font-weight="700" fill="#15243e">Что фиксируют в протоколе, чтобы результат был достоверным</text>
  <g font-size="12" fill="#334155">
    <text x="56" y="278">• что именно проверяли: корпус, соединения или затвор;</text>
    <text x="56" y="300">• среда, давления до/после, температура и направление подачи;</text>
    <text x="56" y="322">• положение затвора, выдержка, метод измерения и порог обнаружения;</text>
    <text x="56" y="344">• средства измерений, их диапазон и погрешность; кто и когда проводил.</text>
  </g>

  <rect x="36" y="372" width="808" height="72" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="56" y="398" font-size="12" font-weight="700" fill="#991b1b">«Опрессовали — держит» без указания объекта и критерия — не результат.</text>
  <text x="56" y="420" font-size="12" fill="#991b1b">Через сутки тот же клапан может дать течь по сальнику или пропуск по седлу — это другой объект проверки.</text>
  <text x="56" y="440" font-size="11" fill="#991b1b">Класс и критерий берут из применимых документов для конкретного изделия.</text>

  <text x="24" y="466" font-size="11" fill="#5b6b82">Не переносите критерий из паспорта другого клапана: нормирование зависит от типа, размера и назначения.</text>
</svg>
