<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" font-weight="700" fill="#15243e">Что написано на корпусе арматуры</text>
  <text x="24" y="48" font-size="12" fill="#5b6b82">Маркировку сверяют с паспортом и проектом, а не с внешним видом</text>

  <!-- корпус -->
  <rect x="190" y="120" width="260" height="130" rx="24" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <line x1="230" y1="120" x2="230" y2="88" stroke="#334155" stroke-width="4"/>
  <line x1="205" y1="84" x2="255" y2="84" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <line x1="300" y1="120" x2="300" y2="92" stroke="#334155" stroke-width="6"/>
  <line x1="325" y1="120" x2="325" y2="92" stroke="#334155" stroke-width="6"/>

  <!-- надписи на корпусе -->
  <text x="240" y="170" font-size="18" font-weight="700" fill="#15243e">DN 50</text>
  <text x="350" y="170" font-size="18" font-weight="700" fill="#15243e">PN 40</text>
  <text x="250" y="210" font-size="15" font-weight="700" fill="#15243e">12Х18Н10Т</text>
  <line x1="355" y1="220" x2="405" y2="220" stroke="#315de0" stroke-width="3"/>
  <polygon points="403,214 415,220 403,226" fill="#315de0"/>

  <!-- выноски -->
  <g font-size="12" fill="#15243e">
    <text x="34" y="100">DN — номинальный проход</text>
    <text x="420" y="100">PN — номинальное давление</text>
    <text x="34" y="270">материал корпуса</text>
    <text x="420" y="270">направление потока</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <line x1="34" y1="108" x2="220" y2="150"/>
    <line x1="420" y1="108" x2="380" y2="150"/>
    <line x1="34" y1="278" x2="250" y2="205"/>
    <line x1="420" y1="278" x2="392" y2="225"/>
  </g>

  <text x="24" y="322" font-size="11" fill="#5b6b82">DN 50 — это не наружный диаметр 50 мм: у такой трубы наружный диаметр около 57 мм.</text>
  <text x="24" y="340" font-size="11" fill="#5b6b82">PN 40 — расчётный класс, а не разрешение работать при 40 бар при любой температуре.</text>
</svg>
