<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="340" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" font-weight="700" fill="#15243e">Как измерить авторитет на действующем объекте</text>
  <text x="24" y="48" font-size="12" fill="#5b6b82">Три точки отбора давления при установившемся расчётном расходе</text>

  <!-- линия -->
  <line x1="96" y1="160" x2="580" y2="160" stroke="#667" stroke-width="3"/>
  <polygon points="150,153 166,160 150,167" fill="#667"/>

  <!-- насос -->
  <circle cx="68" cy="160" r="28" fill="#eef3fd" stroke="#315de0" stroke-width="2"/>
  <path d="M57 147 L85 160 L57 173 Z" fill="#315de0"/>
  <text x="68" y="206" font-size="11" text-anchor="middle" fill="#5b6b82">насос</text>

  <!-- клапан -->
  <path d="M262 135 L302 160 L262 185 Z" fill="#fde8e8" stroke="#dc2626" stroke-width="2"/>
  <path d="M342 135 L302 160 L342 185 Z" fill="#fde8e8" stroke="#dc2626" stroke-width="2"/>
  <line x1="302" y1="160" x2="302" y2="118" stroke="#dc2626" stroke-width="2"/>
  <line x1="284" y1="118" x2="320" y2="118" stroke="#dc2626" stroke-width="4"/>
  <text x="302" y="206" font-size="11" text-anchor="middle" fill="#dc2626">клапан</text>

  <!-- остальной контур -->
  <rect x="390" y="132" width="110" height="56" rx="9" fill="#f2f8f3" stroke="#16a34a" stroke-width="2"/>
  <text x="445" y="155" font-size="11" text-anchor="middle" fill="#15243e">остальной</text>
  <text x="445" y="171" font-size="11" text-anchor="middle" fill="#15243e">контур</text>

  <!-- манометры -->
  <g stroke="#315de0" stroke-width="2" fill="#ffffff">
    <line x1="220" y1="160" x2="220" y2="118"/>
    <circle cx="220" cy="104" r="14"/>
    <line x1="330" y1="160" x2="330" y2="118"/>
    <circle cx="330" cy="104" r="14"/>
    <line x1="545" y1="160" x2="545" y2="118"/>
    <circle cx="545" cy="104" r="14"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#315de0">
    <text x="220" y="109">p1</text>
    <text x="330" y="109">p2</text>
    <text x="545" y="109">p3</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#5b6b82">
    <text x="220" y="82">до клапана</text>
    <text x="330" y="82">после клапана</text>
    <text x="545" y="82">после контура</text>
  </g>

  <!-- формула -->
  <rect x="110" y="226" width="420" height="34" rx="8" fill="#f4f7fc" stroke="#dbe3ef"/>
  <text x="320" y="249" font-size="14" text-anchor="middle" fill="#15243e">a = (p1 − p2) / (p1 − p3)</text>
  <g font-size="12" fill="#5b6b82">
    <text x="24" y="286">Пример: p1 = 6,2 бар; p2 = 5,4 бар; p3 = 2,8 бар.</text>
    <text x="24" y="304">a = (6,2 − 5,4) / (6,2 − 2,8) = 0,8 / 3,4 ≈ 0,24.</text>
    <text x="24" y="322">При точности манометров ±0,1 бар оценка лежит примерно в диапазоне 0,17…0,31.</text>
  </g>
</svg>
