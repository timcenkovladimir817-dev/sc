<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="340" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" font-weight="700" fill="#15243e">Что делает завышенный Kvs</text>
  <text x="24" y="48" font-size="12" fill="#5b6b82">Один и тот же расход, но клапану достаётся всё меньшая доля перепада</text>

  <text x="24" y="100" font-size="13" font-weight="700" fill="#15243e">Kvs по расчёту</text>
  <text x="24" y="118" font-size="11" fill="#5b6b82">Δp v,100 = 0,2 бар</text>
  <rect x="120" y="82" width="72" height="32" fill="#dc2626"/>
  <rect x="192" y="82" width="288" height="32" fill="#16a34a"/>
  <text x="156" y="103" font-size="11" text-anchor="middle" fill="#ffffff">20 %</text>
  <text x="336" y="103" font-size="11" text-anchor="middle" fill="#ffffff">80 %</text>
  <text x="492" y="98" font-size="12" fill="#15243e">a = 0,20</text>
  <text x="492" y="116" font-size="12" fill="#dc2626">q(0,5) = 79 %</text>

  <text x="24" y="200" font-size="13" font-weight="700" fill="#15243e">Kvs завышен в 2 раза</text>
  <text x="24" y="218" font-size="11" fill="#5b6b82">Δp v,100 = 0,05 бар</text>
  <rect x="120" y="182" width="18" height="32" fill="#dc2626"/>
  <rect x="138" y="182" width="342" height="32" fill="#16a34a"/>
  <text x="126" y="176" font-size="11" fill="#dc2626">5 %</text>
  <text x="309" y="203" font-size="11" text-anchor="middle" fill="#ffffff">95 %</text>
  <text x="492" y="198" font-size="12" fill="#15243e">a = 0,05</text>
  <text x="492" y="216" font-size="12" fill="#dc2626">q(0,5) = 93 %</text>

  <rect x="120" y="244" width="14" height="14" fill="#dc2626"/>
  <text x="142" y="256" font-size="12" fill="#15243e">клапан</text>
  <rect x="220" y="244" width="14" height="14" fill="#16a34a"/>
  <text x="242" y="256" font-size="12" fill="#15243e">остальной контур</text>

  <text x="24" y="294" font-size="11" fill="#5b6b82">При постоянном общем перепаде 1 бар увеличение Kvs в 2 раза снижает Δp v,100 в 4 раза.</text>
  <text x="24" y="312" font-size="11" fill="#5b6b82">Половина хода теперь даёт 93 % расхода: регулирование почти исчезает, хотя клапан «исправен».</text>
</svg>
