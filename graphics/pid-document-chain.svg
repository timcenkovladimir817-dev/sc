<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Arial, Helvetica, sans-serif">
  <rect width="880" height="480" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#15243e">Документальная цепочка: от тега на схеме до истории ремонта</text>
  <text x="24" y="50" font-size="12" fill="#5b6b82">Каждый документ должен быть привязан к конкретному исполнению, а не к «линейке» изделий</text>

  <g font-size="12" fill="#15243e">
    <rect x="40" y="80" width="180" height="56" rx="9" fill="#eef3fd" stroke="#315de0"/>
    <text x="130" y="104" text-anchor="middle" font-weight="700">P&amp;ID / тег</text>
    <text x="130" y="122" text-anchor="middle">FV-101, позиция</text>

    <rect x="260" y="80" width="180" height="56" rx="9" fill="#eef3fd" stroke="#315de0"/>
    <text x="350" y="104" text-anchor="middle" font-weight="700">Спецификация</text>
    <text x="350" y="122" text-anchor="middle">проект, параметры</text>

    <rect x="480" y="80" width="180" height="56" rx="9" fill="#fef3e2" stroke="#d97706"/>
    <text x="570" y="104" text-anchor="middle" font-weight="700">Паспорт</text>
    <text x="570" y="122" text-anchor="middle">заводской номер</text>

    <rect x="700" y="80" width="150" height="56" rx="9" fill="#fef3e2" stroke="#d97706"/>
    <text x="775" y="104" text-anchor="middle" font-weight="700">Бирка</text>
    <text x="775" y="122" text-anchor="middle">полное обозначение</text>

    <rect x="40" y="200" width="180" height="56" rx="9" fill="#e8f6ec" stroke="#16a34a"/>
    <text x="130" y="224" text-anchor="middle" font-weight="700">Руководство</text>
    <text x="130" y="242" text-anchor="middle">монтаж, настройка</text>

    <rect x="260" y="200" width="180" height="56" rx="9" fill="#e8f6ec" stroke="#16a34a"/>
    <text x="350" y="224" text-anchor="middle" font-weight="700">Чертежи</text>
    <text x="350" y="242" text-anchor="middle">трим, размеры</text>

    <rect x="480" y="200" width="180" height="56" rx="9" fill="#f8fafc" stroke="#64748b"/>
    <text x="570" y="224" text-anchor="middle" font-weight="700">Сертификаты</text>
    <text x="570" y="242" text-anchor="middle">применимость</text>

    <rect x="700" y="200" width="150" height="56" rx="9" fill="#f8fafc" stroke="#64748b"/>
    <text x="775" y="224" text-anchor="middle" font-weight="700">Ремонты</text>
    <text x="775" y="242" text-anchor="middle">история, отказы</text>
  </g>

  <g stroke="#667" stroke-width="2" fill="#667">
    <line x1="220" y1="108" x2="260" y2="108"/><polygon points="256,102 264,108 256,114"/>
    <line x1="440" y1="108" x2="480" y2="108"/><polygon points="476,102 484,108 476,114"/>
    <line x1="660" y1="108" x2="700" y2="108"/><polygon points="696,102 704,108 696,114"/>
    <line x1="130" y1="136" x2="130" y2="200"/><polygon points="124,196 130,204 136,196"/>
    <line x1="350" y1="136" x2="350" y2="200"/><polygon points="344,196 350,204 356,196"/>
    <line x1="570" y1="136" x2="570" y2="200"/><polygon points="564,196 570,204 576,196"/>
    <line x1="775" y1="136" x2="775" y2="200"/><polygon points="769,196 775,204 781,196"/>
  </g>

  <rect x="40" y="300" width="810" height="120" rx="10" fill="#fff7ed" stroke="#d97706"/>
  <text x="60" y="328" font-size="13" font-weight="700" fill="#9a5b00">Три типовые ловушки</text>
  <g font-size="12" fill="#7c4a03">
    <text x="60" y="354">1. Универсальная инструкция для серии не заменяет параметры конкретного исполнения.</text>
    <text x="60" y="376">2. Сертификат без проверки области применения не доказывает пригодность для вашей среды.</text>
    <text x="60" y="398">3. Заводской номер на бирке и в паспорте должны совпадать; фото бирки делают до разборки.</text>
  </g>

  <text x="24" y="456" font-size="11" fill="#5b6b82">Если цепочка рвётся, появляется «документ от похожего клапана» — источник неверных моментов, допусков и критериев.</text>
</svg>
