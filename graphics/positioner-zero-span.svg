<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="860" height="400" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#15243e">Позиционер: команда, ход и обратная связь</text>
  <text x="24" y="50" font-size="12" fill="#5b6b82">Позиционер сравнивает задание с фактическим положением; ноль и span задают соответствие</text>

  <!-- block diagram -->
  <g font-size="12" fill="#15243e">
    <rect x="30" y="90" width="120" height="54" rx="9" fill="#eef3fd" stroke="#315de0"/>
    <text x="90" y="114" text-anchor="middle">Сигнал</text><text x="90" y="132" text-anchor="middle">4–20 мА</text>
    <rect x="190" y="90" width="140" height="54" rx="9" fill="#fef3e2" stroke="#d97706"/>
    <text x="260" y="114" text-anchor="middle">Позиционер</text><text x="260" y="132" text-anchor="middle">сравнение</text>
    <rect x="370" y="90" width="130" height="54" rx="9" fill="#eef3fd" stroke="#315de0"/>
    <text x="435" y="114" text-anchor="middle">Привод</text><text x="435" y="132" text-anchor="middle">усилие</text>
    <rect x="540" y="90" width="120" height="54" rx="9" fill="#e8f6ec" stroke="#16a34a"/>
    <text x="600" y="114" text-anchor="middle">Шток</text><text x="600" y="132" text-anchor="middle">ход</text>
    <rect x="700" y="90" width="120" height="54" rx="9" fill="#f8fafc" stroke="#64748b"/>
    <text x="760" y="114" text-anchor="middle">Датчик</text><text x="760" y="132" text-anchor="middle">обратная связь</text>
  </g>
  <g stroke="#667" stroke-width="2" fill="#667">
    <line x1="150" y1="117" x2="190" y2="117"/><polygon points="186,111 194,117 186,123"/>
    <line x1="330" y1="117" x2="370" y2="117"/><polygon points="366,111 374,117 366,123"/>
    <line x1="500" y1="117" x2="540" y2="117"/><polygon points="536,111 544,117 536,123"/>
    <line x1="660" y1="117" x2="700" y2="117"/><polygon points="696,111 704,117 696,123"/>
  </g>
  <path d="M760 144 L760 170 L260 170 L260 144" fill="none" stroke="#315de0" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="254,148 260,140 266,148" fill="#315de0"/>
  <text x="510" y="188" font-size="11" text-anchor="middle" fill="#1e3a8a">обратная связь по положению</text>

  <!-- graph -->
  <rect x="30" y="215" width="380" height="150" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <line x1="80" y1="330" x2="370" y2="330" stroke="#667" stroke-width="2"/>
  <line x1="80" y1="240" x2="80" y2="330" stroke="#667" stroke-width="2"/>
  <line x1="80" y1="330" x2="340" y2="250" stroke="#315de0" stroke-width="3"/>
  <text x="60" y="238" font-size="11" fill="#5b6b82">ход</text>
  <text x="350" y="350" font-size="11" fill="#5b6b82">сигнал</text>
  <circle cx="80" cy="330" r="5" fill="#dc2626"/>
  <text x="92" y="326" font-size="11" fill="#dc2626">ноль</text>
  <circle cx="340" cy="250" r="5" fill="#16a34a"/>
  <text x="300" y="242" font-size="11" fill="#166534">span</text>

  <rect x="440" y="215" width="390" height="150" rx="10" fill="#ffffff" stroke="#dbe3ef"/>
  <text x="460" y="242" font-size="13" font-weight="700" fill="#15243e">Что проверить до калибровки</text>
  <g font-size="11" fill="#5b6b82">
    <text x="460" y="268">• механическую связь и полный ход;</text>
    <text x="460" y="290">• направление действия и split-range;</text>
    <text x="460" y="312">• фактический сигнал и питание;</text>
    <text x="460" y="334">• люфт, трение и ограничители.</text>
  </g>

  <text x="24" y="386" font-size="11" fill="#5b6b82">Автокалибровка часто двигает шток на полный ход: на действующем процессе её запускают только по разрешённой программе.</text>
</svg>
