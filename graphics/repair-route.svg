<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#15243e">Маршрут ремонта: от дефектации к прослеживаемому решению</text>
  <text x="24" y="50" font-size="12" fill="#5b6b82">«Износ значительный» — не критерий; решение должно опираться на измерение, норму и источник</text>

  <g font-size="12" fill="#15243e">
    <rect x="40" y="84" width="180" height="54" rx="9" fill="#eef3fd" stroke="#315de0"/>
    <text x="130" y="108" text-anchor="middle" font-weight="700">1. Идентификация</text>
    <text x="130" y="126" text-anchor="middle">изделие, детали, фото</text>

    <rect x="250" y="84" width="180" height="54" rx="9" fill="#eef3fd" stroke="#315de0"/>
    <text x="340" y="108" text-anchor="middle" font-weight="700">2. Очистка</text>
    <text x="340" y="126" text-anchor="middle">без потери признаков</text>

    <rect x="460" y="84" width="180" height="54" rx="9" fill="#fef3e2" stroke="#d97706"/>
    <text x="550" y="108" text-anchor="middle" font-weight="700">3. Осмотр</text>
    <text x="550" y="126" text-anchor="middle">механизм повреждения</text>

    <rect x="670" y="84" width="190" height="54" rx="9" fill="#fef3e2" stroke="#d97706"/>
    <text x="765" y="108" text-anchor="middle" font-weight="700">4. Измерения</text>
    <text x="765" y="126" text-anchor="middle">место, метод, значение</text>

    <rect x="670" y="190" width="190" height="54" rx="9" fill="#e8f6ec" stroke="#16a34a"/>
    <text x="765" y="214" text-anchor="middle" font-weight="700">5. Сравнение</text>
    <text x="765" y="232" text-anchor="middle">с нормой и источником</text>

    <rect x="460" y="190" width="180" height="54" rx="9" fill="#e8f6ec" stroke="#16a34a"/>
    <text x="550" y="214" text-anchor="middle" font-weight="700">6. Решение</text>
    <text x="550" y="232" text-anchor="middle">восстановить / заменить</text>

    <rect x="250" y="190" width="180" height="54" rx="9" fill="#f8fafc" stroke="#64748b"/>
    <text x="340" y="214" text-anchor="middle" font-weight="700">7. Сборка</text>
    <text x="340" y="232" text-anchor="middle">моменты, зазоры, чистота</text>

    <rect x="40" y="190" width="180" height="54" rx="9" fill="#f8fafc" stroke="#64748b"/>
    <text x="130" y="214" text-anchor="middle" font-weight="700">8. Проверки</text>
    <text x="130" y="232" text-anchor="middle">ход, усилие, утечка</text>
  </g>

  <g stroke="#667" stroke-width="2" fill="#667">
    <line x1="220" y1="111" x2="250" y2="111"/><polygon points="246,105 254,111 246,117"/>
    <line x1="430" y1="111" x2="460" y2="111"/><polygon points="456,105 464,111 456,117"/>
    <line x1="640" y1="111" x2="670" y2="111"/><polygon points="666,105 674,111 666,117"/>
    <line x1="765" y1="138" x2="765" y2="190"/><polygon points="759,186 765,194 771,186"/>
    <line x1="670" y1="217" x2="640" y2="217"/><polygon points="644,211 636,217 644,223"/>
    <line x1="460" y1="217" x2="430" y2="217"/><polygon points="434,211 426,217 434,223"/>
    <line x1="250" y1="217" x2="220" y2="217"/><polygon points="224,211 216,217 224,223"/>
  </g>

  <rect x="40" y="292" width="820" height="88" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="60" y="318" font-size="13" font-weight="700" fill="#15243e">Что делает решение прослеживаемым</text>
  <g font-size="12" fill="#334155">
    <text x="60" y="342">• ссылка на чертёж и номер детали; • измеренное значение и допуск; • метод и средство измерения;</text>
    <text x="60" y="364">• заключение «годен / не годен»; • кто принял решение и когда; • что изменено в комплектации.</text>
  </g>

  <rect x="40" y="400" width="820" height="62" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="60" y="424" font-size="12" font-weight="700" fill="#991b1b">Опасная практика: заменить деталь, не установив причину повреждения.</text>
  <text x="60" y="446" font-size="12" fill="#991b1b">Если режим сохранился, новый комплект разрушится по тому же механизму.</text>

  <text x="24" y="492" font-size="11" fill="#5b6b82">Нормы и допуски берут из документации изготовителя и применимых документов, а не из «опыта на глаз».</text>
</svg>
