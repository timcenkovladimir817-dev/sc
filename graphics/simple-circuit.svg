<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" font-weight="700" fill="#15243e">Простой контур: куда уходит давление</text>
  <text x="24" y="48" font-size="12" fill="#5b6b82">Вода идёт по кругу, расход одинаковый, а давление делится между элементами</text>

  <!-- труба-контур -->
  <g stroke="#667" stroke-width="6" fill="none">
    <path d="M90 250 L90 90 L550 90 L550 250 L90 250"/>
  </g>

  <!-- стрелки направления -->
  <g fill="#667">
    <polygon points="420,82 440,90 420,98"/>
    <polygon points="542,160 550,180 558,160"/>
    <polygon points="340,242 320,250 340,258"/>
    <polygon points="82,180 90,160 98,180"/>
  </g>

  <!-- насос -->
  <circle cx="170" cy="250" r="26" fill="#eef3fd" stroke="#315de0" stroke-width="2"/>
  <path d="M159 237 L187 250 L159 263 Z" fill="#315de0"/>
  <text x="170" y="292" font-size="12" text-anchor="middle" fill="#15243e">насос</text>
  <text x="170" y="308" font-size="10" text-anchor="middle" fill="#5b6b82">толкает воду</text>

  <!-- клапан -->
  <path d="M292 70 L332 90 L292 110 Z" fill="#fde8e8" stroke="#dc2626" stroke-width="2"/>
  <path d="M372 70 L332 90 L372 110 Z" fill="#fde8e8" stroke="#dc2626" stroke-width="2"/>
  <line x1="332" y1="70" x2="332" y2="50" stroke="#dc2626" stroke-width="2"/>
  <line x1="316" y1="50" x2="348" y2="50" stroke="#dc2626" stroke-width="4"/>
  <text x="332" y="38" font-size="12" text-anchor="middle" fill="#dc2626">клапан — регулируемый кран</text>

  <!-- потребитель -->
  <rect x="500" y="135" width="120" height="70" rx="9" fill="#f2f8f3" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="160" font-size="11" text-anchor="middle" fill="#15243e">потребитель</text>
  <text x="560" y="176" font-size="9" text-anchor="middle" fill="#5b6b82">радиатор или</text>
  <text x="560" y="190" font-size="9" text-anchor="middle" fill="#5b6b82">теплообменник</text>

  <!-- бюджет давления -->
  <text x="90" y="322" font-size="12" fill="#15243e">Напор насоса — 4,0 бар. Он делится на две части:</text>
  <rect x="90" y="332" width="368" height="30" fill="#16a34a"/>
  <rect x="458" y="332" width="92" height="30" fill="#dc2626"/>
  <text x="274" y="352" font-size="11" text-anchor="middle" fill="#ffffff">3,2 бар — трубы, фильтр, потребитель</text>
  <text x="504" y="352" font-size="11" text-anchor="middle" fill="#ffffff">0,8 бар</text>
  <text x="504" y="378" font-size="10" text-anchor="middle" fill="#dc2626">клапан</text>
</svg>
