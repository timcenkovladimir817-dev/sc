<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#15243e">Виды испытаний после ремонта: что именно доказывает каждое</text>
  <text x="24" y="50" font-size="12" fill="#5b6b82">Проверка хода не подтверждает прочность, а проверка корпуса не подтверждает герметичность затвора</text>

  <g font-size="12" fill="#15243e">
    <rect x="30" y="80" width="168" height="180" rx="10" fill="#eef3fd" stroke="#315de0"/>
    <text x="114" y="106" text-anchor="middle" font-weight="700">Функциональная</text>
    <text x="114" y="128" text-anchor="middle">ход, направление,</text>
    <text x="114" y="146" text-anchor="middle">время, реакция</text>
    <text x="114" y="168" text-anchor="middle">на сигнал</text>
    <text x="114" y="198" text-anchor="middle" font-size="11" fill="#1e3a8a">доказывает:</text>
    <text x="114" y="216" text-anchor="middle" font-size="11" fill="#1e3a8a">подвижность и логику</text>
    <text x="114" y="238" text-anchor="middle" font-size="11" fill="#1e3a8a">управления</text>

    <rect x="216" y="80" width="168" height="180" rx="10" fill="#fff7ed" stroke="#d97706"/>
    <text x="300" y="106" text-anchor="middle" font-weight="700">Прочность</text>
    <text x="300" y="128" text-anchor="middle">корпус и детали</text>
    <text x="300" y="146" text-anchor="middle">под давлением</text>
    <text x="300" y="168" text-anchor="middle">без разрушения</text>
    <text x="300" y="198" text-anchor="middle" font-size="11" fill="#9a5b00">доказывает:</text>
    <text x="300" y="216" text-anchor="middle" font-size="11" fill="#9a5b00">несущую способность</text>
    <text x="300" y="238" text-anchor="middle" font-size="11" fill="#9a5b00">и отсутствие деформаций</text>

    <rect x="402" y="80" width="168" height="180" rx="10" fill="#fef2f2" stroke="#dc2626"/>
    <text x="486" y="106" text-anchor="middle" font-weight="700">Внешняя плотность</text>
    <text x="486" y="128" text-anchor="middle">соединения,</text>
    <text x="486" y="146" text-anchor="middle">сальник, корпус</text>
    <text x="486" y="168" text-anchor="middle">наружу</text>
    <text x="486" y="198" text-anchor="middle" font-size="11" fill="#991b1b">доказывает:</text>
    <text x="486" y="216" text-anchor="middle" font-size="11" fill="#991b1b">отсутствие внешней</text>
    <text x="486" y="238" text-anchor="middle" font-size="11" fill="#991b1b">течи в условиях опыта</text>

    <rect x="588" y="80" width="168" height="180" rx="10" fill="#e8f6ec" stroke="#16a34a"/>
    <text x="672" y="106" text-anchor="middle" font-weight="700">Герметичность</text>
    <text x="672" y="128" text-anchor="middle">затвора</text>
    <text x="672" y="146" text-anchor="middle">при закрытии</text>
    <text x="672" y="168" text-anchor="middle">по классу</text>
    <text x="672" y="198" text-anchor="middle" font-size="11" fill="#166534">доказывает:</text>
    <text x="672" y="216" text-anchor="middle" font-size="11" fill="#166534">утечку не выше нормы</text>
    <text x="672" y="238" text-anchor="middle" font-size="11" fill="#166534">для данного изделия</text>

    <rect x="774" y="80" width="96" height="180" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="822" y="106" text-anchor="middle" font-weight="700">Настройка</text>
    <text x="822" y="132" text-anchor="middle" font-size="11">ноль, span,</text>
    <text x="822" y="150" text-anchor="middle" font-size="11">направление,</text>
    <text x="822" y="168" text-anchor="middle" font-size="11">позиционер</text>
  </g>

  <rect x="30" y="288" width="840" height="110" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="50" y="316" font-size="13" font-weight="700" fill="#15243e">Порядок и доказательства</text>
  <g font-size="12" fill="#334155">
    <text x="50" y="342">До испытаний: программа, критерии, средства измерений, ответственные, безопасность стенда.</text>
    <text x="50" y="364">Во время: фактические параметры, время, поведение, отклонения, вмешательства.</text>
    <text x="50" y="386">После: протокол, ссылки на документы, ограничения результата и подписи.</text>
  </g>

  <rect x="30" y="414" width="840" height="52" rx="10" fill="#fff7ed" stroke="#d97706"/>
  <text x="50" y="438" font-size="12" fill="#7c4a03" font-weight="700">Ограничение результата — часть заключения: «проверено при таких-то условиях».</text>
  <text x="50" y="458" font-size="12" fill="#7c4a03">Нельзя распространять вывод испытания на режимы, которые не воспроизводились.</text>

  <text x="24" y="476" font-size="11" fill="#5b6b82">Конкретные давления, выдержки и критерии — по применимым документам и программе испытаний.</text>
</svg>
