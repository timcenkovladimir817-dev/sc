<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="320" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#15243e">Авторитет клапана: как делится перепад в контуре</text>
  <text x="24" y="50" font-size="12" fill="#5b6b82">Один расчётный расход, один явно очерченный контур</text>

  <!-- насос -->
  <circle cx="86" cy="150" r="30" fill="#eef3fd" stroke="#315de0" stroke-width="2"/>
  <path d="M74 136 L104 150 L74 164 Z" fill="#315de0"/>
  <text x="86" y="202" font-size="11" text-anchor="middle" fill="#5b6b82">насос</text>

  <!-- линия -->
  <line x1="116" y1="150" x2="250" y2="150" stroke="#667" stroke-width="3"/>
  <line x1="330" y1="150" x2="560" y2="150" stroke="#667" stroke-width="3"/>
  <polygon points="180,143 194,150 180,157" fill="#667"/>
  <text x="200" y="140" font-size="11" fill="#5b6b82">Q</text>

  <!-- клапан -->
  <path d="M250 125 L290 150 L250 175 Z" fill="#fde8e8" stroke="#dc2626" stroke-width="2"/>
  <path d="M330 125 L290 150 L330 175 Z" fill="#fde8e8" stroke="#dc2626" stroke-width="2"/>
  <line x1="290" y1="150" x2="290" y2="108" stroke="#dc2626" stroke-width="2"/>
  <line x1="272" y1="108" x2="308" y2="108" stroke="#dc2626" stroke-width="4"/>
  <text x="290" y="202" font-size="11" text-anchor="middle" fill="#dc2626">клапан</text>

  <!-- остальной контур -->
  <rect x="380" y="118" width="180" height="64" rx="10" fill="#f2f8f3" stroke="#16a34a" stroke-width="2"/>
  <text x="470" y="145" font-size="12" text-anchor="middle" fill="#15243e">остальной контур</text>
  <text x="470" y="164" font-size="10" text-anchor="middle" fill="#5b6b82">трубы · арматура · теплообменник</text>

  <!-- скобки перепадов -->
  <path d="M250 78 L250 68 L330 68 L330 78" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="290" y="60" font-size="12" text-anchor="middle" fill="#dc2626">Δp v,100</text>
  <path d="M380 78 L380 68 L560 68 L560 78" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="470" y="60" font-size="12" text-anchor="middle" fill="#16a34a">Δp rest</text>

  <!-- формула -->
  <rect x="120" y="222" width="400" height="38" rx="8" fill="#f4f7fc" stroke="#dbe3ef"/>
  <text x="320" y="247" font-size="15" text-anchor="middle" fill="#15243e">a = Δp v,100 / (Δp v,100 + Δp rest)</text>
  <text x="320" y="292" font-size="11" text-anchor="middle" fill="#5b6b82">Δp v,100 — перепад на полностью открытом клапане при расчётном расходе</text>
  <text x="320" y="308" font-size="11" text-anchor="middle" fill="#5b6b82">Δp rest — перепад на остальной части контура при том же расходе</text>
</svg>
