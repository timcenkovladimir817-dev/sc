<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="420" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" font-weight="700" fill="#15243e">Клапан в разрезе: из чего он состоит</text>
  <text x="24" y="48" font-size="12" fill="#5b6b82">Корпус держит давление, затвор перекрывает проход, шток передаёт движение</text>

  <!-- труба -->
  <rect x="40" y="210" width="560" height="44" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/>
  <g fill="#315de0">
    <polygon points="68,224 86,232 68,240"/>
    <polygon points="554,224 572,232 554,240"/>
  </g>
  <text x="96" y="238" font-size="11" fill="#315de0">поток</text>
  <text x="498" y="238" font-size="11" fill="#315de0">поток</text>

  <!-- корпус -->
  <rect x="235" y="175" width="170" height="114" rx="20" fill="#ffffff" stroke="#334155" stroke-width="3"/>

  <!-- сёдла -->
  <polygon points="270,210 292,210 287,254 275,254" fill="#dc2626"/>
  <polygon points="348,210 370,210 365,254 353,254" fill="#dc2626"/>

  <!-- затвор -->
  <polygon points="296,210 344,210 334,250 306,250" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>

  <!-- шток -->
  <rect x="316" y="78" width="8" height="132" fill="#334155"/>

  <!-- крышка -->
  <polygon points="290,132 350,132 342,175 298,175" fill="#f8fafc" stroke="#334155" stroke-width="2"/>

  <!-- сальник -->
  <rect x="300" y="100" width="40" height="22" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="2"/>

  <!-- маховик -->
  <line x1="280" y1="70" x2="360" y2="70" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <line x1="320" y1="70" x2="320" y2="78" stroke="#334155" stroke-width="3"/>

  <!-- подписи слева -->
  <g font-size="13" fill="#15243e">
    <text x="64" y="178">корпус</text>
    <text x="64" y="112">сальник</text>
    <text x="64" y="274">затвор</text>
    <text x="64" y="344">проход</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <line x1="126" y1="173" x2="235" y2="200"/>
    <line x1="126" y1="107" x2="300" y2="110"/>
    <line x1="126" y1="269" x2="300" y2="238"/>
    <line x1="126" y1="339" x2="180" y2="254"/>
  </g>

  <!-- подписи справа -->
  <g font-size="13" fill="#15243e">
    <text x="470" y="96">шток</text>
    <text x="470" y="152">крышка</text>
    <text x="470" y="274">седло</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <line x1="462" y1="90" x2="324" y2="90"/>
    <line x1="462" y1="146" x2="350" y2="150"/>
    <line x1="462" y1="268" x2="365" y2="240"/>
  </g>

  <text x="24" y="396" font-size="11" fill="#5b6b82">Шток идёт вниз — затвор садится на седло, проход закрывается. Шток идёт вверх — проход открывается.</text>
</svg>
