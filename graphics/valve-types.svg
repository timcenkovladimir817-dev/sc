<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="440" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" font-weight="700" fill="#15243e">Четыре способа перекрыть поток</text>
  <text x="24" y="48" font-size="12" fill="#5b6b82">Разные конструкции — разное движение запирающего элемента</text>

  <!-- Задвижка -->
  <rect x="20" y="70" width="330" height="170" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="185" y="96" font-size="14" font-weight="700" text-anchor="middle" fill="#15243e">Задвижка</text>
  <line x1="50" y1="170" x2="320" y2="170" stroke="#94a3b8" stroke-width="8"/>
  <rect x="173" y="118" width="24" height="104" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <line x1="245" y1="120" x2="245" y2="150" stroke="#315de0" stroke-width="2"/>
  <polygon points="239,148 245,160 251,148" fill="#315de0"/>
  <text x="185" y="220" font-size="11" text-anchor="middle" fill="#5b6b82">Клин или диск идёт поперёк потока</text>

  <!-- Клапан -->
  <rect x="370" y="70" width="330" height="170" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="535" y="96" font-size="14" font-weight="700" text-anchor="middle" fill="#15243e">Клапан</text>
  <line x1="400" y1="170" x2="670" y2="170" stroke="#94a3b8" stroke-width="8"/>
  <polygon points="505,150 525,170 505,190" fill="#dc2626"/>
  <polygon points="565,150 545,170 565,190" fill="#dc2626"/>
  <polygon points="520,145 550,145 545,170 525,170" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <rect x="531" y="105" width="8" height="45" fill="#334155"/>
  <line x1="600" y1="112" x2="600" y2="140" stroke="#315de0" stroke-width="2"/>
  <polygon points="594,138 600,150 606,138" fill="#315de0"/>
  <text x="535" y="220" font-size="11" text-anchor="middle" fill="#5b6b82">Плунжер прижимается к седлу сверху</text>

  <!-- Шаровой кран -->
  <rect x="20" y="260" width="330" height="160" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="185" y="286" font-size="14" font-weight="700" text-anchor="middle" fill="#15243e">Шаровой кран</text>
  <line x1="50" y1="355" x2="320" y2="355" stroke="#94a3b8" stroke-width="8"/>
  <circle cx="185" cy="355" r="30" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <rect x="165" y="345" width="40" height="20" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <path d="M240 325 A45 45 0 0 1 240 385" fill="none" stroke="#315de0" stroke-width="2"/>
  <polygon points="238,382 250,388 244,376" fill="#315de0"/>
  <text x="185" y="410" font-size="11" text-anchor="middle" fill="#5b6b82">Шар с отверстием поворачивается на 90°</text>

  <!-- Дисковый затвор -->
  <rect x="370" y="260" width="330" height="160" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="535" y="286" font-size="14" font-weight="700" text-anchor="middle" fill="#15243e">Дисковый затвор</text>
  <line x1="400" y1="355" x2="670" y2="355" stroke="#94a3b8" stroke-width="8"/>
  <ellipse cx="535" cy="355" rx="16" ry="38" fill="#fca5a5" stroke="#dc2626" stroke-width="2" transform="rotate(25 535 355)"/>
  <path d="M590 325 A45 45 0 0 1 590 385" fill="none" stroke="#315de0" stroke-width="2"/>
  <polygon points="588,382 600,388 594,376" fill="#315de0"/>
  <text x="535" y="410" font-size="11" text-anchor="middle" fill="#5b6b82">Диск поворачивается внутри трубы</text>
</svg>
