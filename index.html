<style>
:root{--blue:#315de0;--ink:#20304b;--muted:#65738a;--line:#dce4ef}*{box-sizing:border-box}body{margin:0;font:16px/1.75 system-ui,sans-serif;color:var(--ink);background:#f2f5fa}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:0;border-radius:9px;background:var(--blue);color:white;padding:10px 16px}button:disabled{cursor:default;opacity:.6}button.secondary{background:#e9eefa;color:#284aa2}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #e7a126;outline-offset:3px}a{color:var(--blue)}.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{background:#15243e;padding:25px 17px;color:white}aside small{color:#adc0df}nav{display:grid;gap:8px;margin-top:24px}nav button{text-align:left;background:transparent;color:#ccd8ec}nav button.active{background:#2b477b;color:white}main{padding:28px 38px;max-width:1350px;width:100%}h1{font-size:29px;line-height:1.3;margin:8px 0 24px}h2{font-size:23px;line-height:1.4;margin:0 0 14px}h3{font-size:19px;margin:0 0 9px}p{margin:0 0 14px}.muted,small{color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:24px;margin-bottom:19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid .card{margin:0}.notice{border-left:4px solid #d5a242;background:#fff7e5;border-radius:7px;padding:14px 18px;font-size:14px;margin:16px 0}.pill{display:inline-block;font-size:12px;background:#edf1fc;color:#3453a1;padding:4px 10px;border-radius:20px;margin-bottom:10px}.bar{height:8px;border-radius:10px;background:#e4ebf5;margin:12px 0 20px;overflow:hidden}.bar span{display:block;height:100%;background:var(--blue)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 0}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#4267ca;font-weight:700}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f4f7fc}details{border-top:1px solid var(--line);padding-top:12px;margin-top:15px}summary{cursor:pointer;font-weight:650}.lesson{max-width:960px}.lesson p{line-height:1.9}.toc{display:flex;flex-wrap:wrap;gap:8px}.toc a{font-size:13px;background:#edf2fa;padding:5px 9px;border-radius:6px;text-decoration:none}.section{scroll-margin-top:18px}.section h2{font-size:21px}.field{margin-bottom:15px}label{display:block;font-weight:600;margin-bottom:5px}input,textarea,select{width:100%;padding:10px;border:1px solid #bbc9de;border-radius:9px;background:white;color:var(--ink)}textarea{min-height:190px;resize:vertical}.good{padding:14px;background:#eaf7ee;border-radius:8px}.bad{padding:14px;background:#fff0ed;border-radius:8px}.option{display:block;width:100%;text-align:left;background:#eef2fa;color:var(--ink);margin:10px 0}.footer{font-size:12px;color:var(--muted);margin-top:25px}.search{max-width:550px;margin-bottom:20px}.stat{font-size:35px;font-weight:750}.reading{font-size:13px;color:var(--muted)}@media(max-width:850px){.layout{grid-template-columns:200px 1fr}main{padding:24px}.grid{grid-template-columns:1fr}}@media(max-width:650px){.layout{display:block}aside{padding:14px}nav{display:flex;overflow:auto;margin-top:10px}nav button{white-space:nowrap}main{padding:19px 13px}.card{padding:19px}h1{font-size:25px}}@media print{aside,.actions,nav,.footer,button{display:none!important}.layout{display:block}main{padding:0;max-width:none}.card{border:0;break-inside:avoid;padding:10px 0}.notice{background:white}details>*{display:block}body{background:white;color:black}}
 .lesson .section p,.lesson article p{white-space:pre-wrap} #editor-form textarea{line-height:1.6} </style></head><body><div class="layout"><aside><b style="font-size:22px">АРМАТУРА / PRO</b><br><small>Учебник с редактором · версия 4</small><nav id="nav" aria-label="Главное меню"></nav></aside><main><div class="eyebrow">Запорная и регулирующая арматура</div><h1 id="title"></h1><div id="view"></div><div class="footer">Учебные материалы не заменяют техническую документацию, очную практику, аттестацию и допуски. Статус «изучено» — самоотметка, а не подтверждённая квалификация.</div></main></div>
<script>
'use strict';
const modules=[{"title": "Как устроена арматура: от потока до затвора", "hours": 8, "goal": "Понимать назначение каждой детали и отличать функцию изделия от его внешнего вида.", "sections": [["С чего начать читателю", "Представьте трубопровод как цепь сопротивлений: трубы, повороты, фильтр, теплообменник и арматура. Насос или разность давлений создают движение среды. Запорное изделие должно разобщать участки, регулирующее — изменять сопротивление управляемо, а обратное — препятствовать обратному потоку. Одно изделие может совмещать функции, но это должно подтверждаться документацией. Нельзя считать любой шаровой кран регулирующим только потому, что его можно оставить полуоткрытым."], ["Корпус, крышка, шток и направляющие", "Корпус удерживает давление и формирует канал. Крышка даёт доступ к внутренним деталям и часто несёт уплотнение штока. Шток передаёт усилие поступательно, вал — вращательно. Направляющие поддерживают положение подвижной детали. Износ направляющей способен вызвать перекос и ускорить повреждение седла; поэтому повторная смена седла без проверки направляющих может не устранить причину. Подвижные соединения и прокладки крышки — разные пути наружной утечки."], ["Что такое затвор и седло", "В строгой терминологии затвор — совокупность подвижных и неподвижных элементов, образующих проходное сечение и соединение, препятствующее протеканию среды. Подвижную деталь корректнее называть запирающим или регулирующим элементом: плунжером, диском, шаром и т. п. Седло — элемент затвора, расположенный или сформированный в корпусе; встречаются и подвижные исполнения. В разговоре «затвором» часто называют только плунжер — в документах лучше уточнять, что именно имеется в виду."], ["Формы подвижного элемента", "Тарельчатый элемент садится на кольцевую поверхность: типичен для клапанов. Игольчатый имеет вытянутый конус и позволяет дозировать небольшие расходы, но малый проход чувствителен к загрязнению. Профилированный плунжер и клетка формируют характеристику и распределение перепада. V-образный вырез шара или сегмента позволяет управлять проходом при повороте; это специальное регулирующее исполнение, а не свойство любого шарового крана. Сферический элемент с круглым проходом типичен для запорных кранов. Пригодность для суспензии, вязкой или абразивной среды определяется всем узлом, не одной формой."], ["DN, PN и давление: три разных понятия", "DN — номинальный размер, не гарантированный измеренный внутренний диаметр. PN — обозначение номинального давления, а не разрешение работать при таком давлении при любой температуре. P1 и P2 — реальные давления перед и после клапана; их разность определяет перепад. Для расчётов кавитации и газа нужны абсолютные давления: Pabs = Pgauge + Patm. Бар и МПа не равны: 1 МПа = 10 бар. Ошибка в единицах даёт неверный подбор даже при правильной формуле."], ["Пример: клапан открылся, но расход мал", "Если шток прошёл полный ход, это подтверждает движение, но не гидравлическую производительность системы. Возможны засорённый фильтр, недостаточный напор насоса, низкий перепад, закрытая соседняя арматура, неверный внутренний комплект или ошибка расходомера. Логика инженера: подтвердить сигнал → определить фактическое положение → собрать давления и расход → проверить схему и ограничения. Начинать с замены привода без этих данных нерационально."]], "table": [["Конструкция", "Как движется элемент", "Основная особенность"], ["Задвижка", "Поперёк прохода", "Обычно запорная функция; дросселирование только по назначению"], ["Клапан", "Плунжер относительно седла", "Удобен для управления проходным сечением"], ["Шаровой кран", "Поворот шара", "Регулирование требует предназначенного исполнения"], ["Дисковый затвор", "Поворот диска", "Момент и характеристика зависят от угла и режима"]], "task": "У изделия DN 50 PN 40 открыт привод, но расход меньше ожидаемого. Какие пять исходных данных нужны до решения о ремонте?", "answer": "Минимум: модель и внутренний комплект; фактическое положение элемента; P1 и P2 с единицами; расход и свойства среды; схема соседних сопротивлений и режим насоса. Также нужны температура, история изменения симптома и достоверность измерений. DN/PN не дают ни Kvs, ни гарантию расхода.", "checks": ["Чем затвор отличается от подвижного элемента?", "Можно ли восстановить Kvs по DN?", "В чём разница между давлением в корпусе и перепадом на клапане?"]}, {"title": "Односедельные, двухседельные и клеточные клапаны", "hours": 8, "goal": "Объяснять баланс усилий, герметичность и выбор внутреннего устройства.", "sections": [["Односедельный клапан: принцип действия", "Один плунжер изменяет площадь одного основного прохода у седла. При перемещении меняется сопротивление, следовательно расход при данном перепаде. Давление действует на эффективную площадь подвижной детали и создаёт гидравлическую силу. Направление потока и конструкция определяют, помогает эта сила закрытию или открытию. Направление «под плунжер» нельзя назначать по общей привычке: смотрят стрелку, чертёж и руководство конкретного клапана."], ["Оценка усилия на простом примере", "Для грубой иллюстрации F ≈ Δp × Aэфф. Если условно Aэфф = 0,002 м², а Δp = 1 МПа = 1 000 000 Па, получаем 2000 Н. Это не расчёт привода: дополнительно нужны усилия уплотнения, трение, пружина, динамика и запас по методике изготовителя. Наружный DN нельзя подставлять вместо эффективной площади. Пример показывает, почему исправный маломощный привод может не посадить клапан при большом перепаде."], ["Двухседельный клапан: почему усилие меньше", "Два прохода и два сопряжённых участка плунжера организуют так, чтобы гидравлические силы частично компенсировались. Это позволяет уменьшать результирующее усилие по сравнению с неразгруженной конструкцией сопоставимой задачи. Полного универсального уравновешивания нет: площади, давление и режимы различаются. Одновременная плотная посадка на два седла сложнее, особенно при температурных деформациях и износе."], ["Преимущества и ограничения", "Односедельную конструкцию часто выбирают там, где важна малая утечка, но требования к приводу при большом перепаде могут быть выше. Двухседельная может быть выгодна по усилию и пропускной способности, но достижимую герметичность надо проверять по данным изготовителя. Это тенденции, не абсолютные правила: существуют разгруженные односедельные конструкции и специальные уплотнения. Нельзя назначать класс герметичности по числу седел."], ["Клетка и разгруженный плунжер", "Клетка направляет плунжер и может содержать окна, которые задают характеристику и дробят поток. В разгруженных конструкциях давление подводят к поверхностям так, чтобы уменьшить результирующую силу; возникают дополнительные уплотнения и потенциальные пути внутренней утечки. Заменяя внутренний комплект, проверяют не только посадочные размеры, но и характеристику, направление потока, допустимый перепад и совместимость с приводом."], ["Пример выбора", "Два клапана одинакового DN имеют подходящий Kvs. Первый обеспечивает требуемую утечку, но существующий привод не развивает нужного посадочного усилия при максимальном перепаде; второй требует меньшего усилия, но не подтверждает нужный класс герметичности. Ни один не является автоматически подходящим. Решение — пересмотреть конструкцию и привод как комплект, а не выбрать меньший момент или большую паспортную цифру отдельно."]], "table": [["Вариант", "Сильная сторона", "Что обязательно проверить"], ["Односедельный неразгруженный", "Одна основная зона посадки", "Усилие и допустимый перепад"], ["Двухседельный", "Частичная компенсация гидравлических сил", "Посадка обоих седел и требуемая утечка"], ["Клеточный / разгруженный", "Направление и управление потоком; снижение усилия по конструкции", "Уплотнения разгрузки, загрязнение, трим, FL"]], "task": "Почему после замены внутреннего комплекта на внешне похожий клапан стал хуже закрываться?", "answer": "Возможны иной эффективный диаметр, другое направление сил, недостающий ход, иной посадочный профиль, несовместимое уплотнение разгрузки или неверная комплектация. Сравнивают точные номера деталей, чертежи, требования к приводу и результаты измерений; «похожий» не означает взаимозаменяемый.", "checks": ["Почему два седла не гарантируют нулевое результирующее усилие?", "Почему клетка не является просто защитной сеткой?", "Какие данные нужны для расчёта привода?"]}, {"title": "Расходные характеристики и авторитет клапана", "hours": 10, "goal": "Понимать отличие паспортной характеристики от поведения установленной системы.", "sections": [["Собственная характеристика", "Это зависимость пропускной способности от относительного хода при установленных условиях определения. Для сравнения удобно использовать h от 0 до 1 и k = Kv/Kvs. График собственной характеристики не равен графику расхода в произвольном трубопроводе: перепад на клапане может меняться вместе с ходом. Производитель указывает реальную характеристику конкретного трима, а учебные формулы показывают лишь идеализированную форму."], ["Линейная", "В идеализации k ≈ h в рабочем диапазоне. При неизменном перепаде равные приращения хода дают примерно равные приращения расхода. Пример: при Kvs = 40 и h = 0,25 получаем Kv ≈ 10; при h = 0,5 — около 20. Если перепад в системе одновременно падает, расход уже не будет возрастать пропорционально ходу."], ["Равнопроцентная", "Равные приращения хода дают одинаковый относительный прирост Kv в рабочем диапазоне. Условная модель k = R^(h−1), где R — параметр идеализированного диапазона. Для R = 50 при h = 0,5 получаем k ≈ 0,141, а не 0,5. Эта формула не описывает плотное закрытие: при h = 0 она даёт 1/R. Зону посадки и минимальный устойчивый ход надо рассматривать отдельно."], ["Быстроткрывающаяся", "В начальной части хода проходная способность растёт быстро, затем изменение становится слабее. Это полезно, когда нужен быстрый переход к значительному расходу, но может затруднять точное дозирование около закрытия. Универсальной нормативной формулы для всех быстроткрывающихся исполнений нет; график √h в учебной иллюстрации — только наглядная модель."], ["Авторитет: сколько перепада достаётся клапану", "В распространённой расчётной постановке a = Δpv,100 / (Δpv,100 + Δprest) при одном выбранном расчётном расходе; Δpv,100 — перепад на полностью открытом клапане, Δprest — на рассматриваемой остальной части контура. Границы контура и расчётный режим нужно явно записать. Это не постоянное паспортное свойство клапана. При низком авторитете изменение клапанного сопротивления сильнее взаимодействует с остальной системой и собственная характеристика искажается."], ["Численный пример установленной характеристики", "Для идеализированной системы с постоянным общим перепадом и квадратичными сопротивлениями q = 1/√(a/k² + 1−a), где q = Q/Q100. Для линейного k = 0,5: при a = 0,5 получается q ≈ 0,632, а при a = 0,1 — q ≈ 0,877. Половина хода уже даёт около 88% расхода: регулирование сжато в узкую область. Формула неприменима без проверки допущений к сложным сетям, переменному напору и предельным режимам."], ["Как выбирать характеристику", "Начинают с процесса: зависимость полезного эффекта от расхода, диапазон режимов, располагаемый перепад, динамика и требуемая точность. Равнопроцентная характеристика часто помогает при переменном перепаде и широком диапазоне нагрузок, линейная может быть удобна при относительно стабильном перепаде. Но правило «теплообменник всегда равнопроцентный» недостаточно: проверяют установленную характеристику и контур в целом."]], "table": [["Характеристика", "При постоянном перепаде", "Риск неверного применения"], ["Линейная", "Приращение расхода близко к приращению хода", "В системе с низким авторитетом станет нелинейной"], ["Равнопроцентная", "Равные относительные приращения", "Модель не описывает область посадки"], ["Быстроткрывающаяся", "Большой прирост в начале", "Грубое регулирование малых расходов"]], "task": "В расчётном режиме на открытом клапане теряется 0,2 бар, на остальном контуре 0,8 бар. Найдите авторитет и объясните, достаточно ли заменить характеристику без анализа сети.", "answer": "a = 0,2/(0,2+0,8) = 0,2. Значение относится только к заданным границам и режиму. Характеристика — лишь часть задачи: нужны режимы насоса, сопротивления, требуемые расходы и рабочий ход. Универсального порога, который автоматически решает пригодность, здесь не назначаем.", "checks": ["Почему половина хода не равна половине расхода?", "Что входит в знаменатель авторитета?", "Почему модель равнопроцентной характеристики не описывает закрытие?"]}, {"title": "Kv, Cv и расчёт по нескольким режимам", "hours": 10, "goal": "Без ошибок использовать единицы и оценивать рабочие точки.", "sections": [["Определения и единицы", "Для жидкости в области применимости упрощённой зависимости Qм³/ч = Kv × √(Δpбар/SG). Американский Cv связан с расходом воды в US gallons per minute при перепаде 1 psi: QUSgpm = Cv × √(Δppsi/SG). Используются именно американские галлоны, не имперские. Относительная плотность SG безразмерна; плотность 1000 кг/м³ нельзя подставлять вместо SG = 1."], ["Перевод Cv и Kv", "При согласованных определениях Kv ≈ 0,865 Cv, Cv ≈ 1,156 Kv. Например, Cv = 100 соответствует Kv ≈ 86,5. Для контроля единиц полезно помнить: 1 US gpm ≈ 0,227125 м³/ч; 1 psi ≈ 0,068948 бар. Сначала приводят единицы, затем считают. Нельзя смешивать Q в м³/ч и перепад в psi в одной «баровой» формуле."], ["Пример 1: вода", "Нужно Q = 30 м³/ч при P1 = 6 бар изб., P2 = 5 бар изб., SG = 1. Перепад 1 бар; Kv = 30. Если при том же расходе доступно только 0,25 бар, Kv = 60. Одинаковый расход не означает одинакового требуемого прохода: располагаемый перепад принципиален."], ["Пример 2: жидкость другой плотности", "При Q = 20 м³/ч, Δp = 0,8 бар и SG = 0,85 получаем Kv = 20 × √(0,85/0,8) ≈ 20,62. Предполагаем однофазную жидкость и применимость упрощения. Для вязкой жидкости отдельно проверяют поправки; снижение плотности не отменяет вязкость и давление насыщенного пара."], ["Меняющийся перепад", "Составьте таблицу минимум из трёх режимов: Qmin, Qnormal, Qmax с соответствующими P1, P2, T и свойствами среды. Максимальный расход не всегда совпадает с самым тяжёлым режимом для привода или кавитации. Вычислите требуемый Kv в каждой точке, затем по реальной характеристике оцените ход. Выбор ближайшего большего Kvs по одной точке может привести к работе остальных режимов почти у седла."], ["Минимальный расход и минимальный перепад", "Минимальный управляемый расход зависит от точности, воспроизводимости хода, трения, реального диапазона Kv, перепада и измерения. Универсального минимального процента открытия нет. Понятие «минимальный рабочий перепад» различно для обычного клапана и пилотно-управляемого соленоидного: второму перепад может быть нужен для самой работы. Уточняйте конструкцию и данные изготовителя."], ["Почему на малых ходах регулирование плохое", "Малая зона около седла может давать высокий относительный эффект от люфта и трения; загрязнение сравнимо с размером щели, а датчик расхода может работать ниже достоверного диапазона. Слишком большой Kvs, неудачная характеристика или позиционер усиливают проблему. Разговорное «захлёбывается» не диагноз: запишите, что именно происходит с заданием, ходом, расходом и давлениями."]], "table": [["Режим", "Q, м³/ч", "Δp, бар; SG=1", "Требуемый Kv"], ["Минимум", "5", "2", "3,54"], ["Норма", "20", "1", "20"], ["Максимум", "30", "0,5", "42,43"]], "task": "Для таблицы режимов объясните, почему Kvs = 45 ещё не доказывает, что клапан подходит, хотя превышает 42,43.", "answer": "Нужно проверить ход при Kv 3,54 и 20 по характеристике, требуемый диапазон, кавитацию и шум, влияние обвязки, допустимый перепад и привод, материалы и герметичность. Точка максимума не покрывает весь диапазон. Запас по подбору обосновывают, а не назначают произвольно.", "checks": ["В какую сторону переводить Cv в Kv?", "Какая плотность подставляется в формулу?", "Почему минимальный расход не является одним постоянным процентом Kvs?"]}, {"title": "Кавитация, вскипание, FL и шум", "hours": 10, "goal": "Отличать механизмы повреждений и правильно понимать коэффициент восстановления давления.", "sections": [["Давление внутри не равно давлению на выходе", "В сужении поток ускоряется и статическое давление падает. Ниже по потоку часть давления восстанавливается. Поэтому P2 может быть выше давления насыщенного пара, а локальное минимальное давление — ниже него. Измерение только P1 и P2 не даёт полного профиля внутри, но вместе с характеристиками клапана позволяет оценивать режим."], ["Кавитация и вскипание", "Если локально образуется пар, а после восстановления давления он конденсируется, схлопывание полостей может вызывать вибрацию, шум и повреждение материала. Если выходное давление таково, что паровая фаза сохраняется, говорят о вскипании (flashing). Эти режимы связаны с температурой и давлением насыщенных паров. Вскипание нельзя всегда устранить одной антикавитационной клеткой: конечное давление системы остаётся физическим ограничением."], ["FL: смысл", "FL — безразмерный коэффициент восстановления давления жидкости, зависящий от конструкции и часто от положения. Концептуально FL = √[(P1−P2)/(P1−Pvc)], где Pvc — давление в зоне минимального сечения. При прочих равных меньший FL соответствует более глубокому локальному падению и более сильному восстановлению. Использовать придуманное значение FL по одному DN нельзя: нужны испытательные данные изготовителя."], ["Предельный перепад: учебная оценка", "Для изолированного клапана в одной из стандартных форм расчёта жидкости предельный перепад оценивают как Δpchoked = FL² × (P1 − FF × Pv). Здесь P1 и Pv — абсолютные давления в согласованных единицах, FF — коэффициент критического давления жидкости по применимой методике. Для клапана с присоединительными элементами применяют дополнительные коэффициенты. Эта граница относится к ограничению расхода, а не к гарантированному началу повреждающей кавитации."], ["Пример с заданными коэффициентами", "Пусть только для учебной задачи P1 = 10 бар абс., Pv = 0,2 бар абс., FF = 0,96. При FL = 0,9 получаем Δpchoked ≈ 7,94 бар; при FL = 0,6 — около 3,53 бар. Одна и та же разность 5 бар попадает по разные стороны расчётной границы. Значения FF и FL в примере заданы, не являются рекомендацией для воды или конкретного клапана. Начало кавитации требует отдельной оценки."], ["Как уменьшают риск", "Многоступенчатый трим распределяет падение давления; многоотверстные конструкции дробят струи, специальные материалы повышают стойкость, изменение схемы может поднять противодавление. Диффузоры и выходные устройства решают конкретные задачи и требуют расчёта, не являются универсальным лечением. Выбор зависит от давления, температуры, расхода, твёрдых частиц, закупоривания каналов и возможности обслуживания."], ["Шум не один и тот же", "Гидродинамический шум жидкости, аэродинамический шум газа, механическая вибрация и резонанс трубопровода требуют разного анализа. Уровень шума связан также с трубой и акустическими условиями. Нельзя обещать заданное число децибел только по типу трима. Акустический контроль полезен для сравнения режимов, но сам по себе не подтверждает класс герметичности."]], "table": [["Наблюдение", "Возможная связь", "Что проверить"], ["Шум зависит от перепада", "Кавитация / турбулентность", "P1/P2/T, Pv и данные трима"], ["Повреждение ниже седла", "Кавитация / эрозия / вскипание", "Морфологию и расчёт режима"], ["Паровая фаза сохраняется", "Вскипание", "Абсолютное P2, свойства среды"]], "task": "После ремонта поставлен трим с тем же Kvs, но другим FL. Почему прежний расчёт расхода не подтверждает допустимость замены?", "answer": "Kvs характеризует пропускную способность, FL — поведение локального давления и ограничение расхода в соответствующей методике. Возможны иные предельные режимы, шум, вибрация и нагрузки. Нужен новый расчёт по данным изготовителя с оценкой всех рабочих точек.", "checks": ["Почему P2 выше Pv не исключает кавитацию?", "Является ли граница запирания расхода границей начала кавитации?", "Чем вскипание отличается от кавитации?"]}, {"title": "Уплотнения штока и ремонтные комплекты", "hours": 8, "goal": "Выбирать проверяемые гипотезы наружной утечки и понимать ограничения материалов.", "sections": [["Как работает сальник", "Набивка уплотняет зазор между штоком и корпусом сальниковой камеры. Осевое обжатие создаёт контакт, который должен ограничивать утечку, но не препятствовать движению чрезмерным трением. Слишком сильное обжатие способно вызвать заедание и рывки. Поэтому «подтянуть до исчезновения любых признаков» без допуска и оценки движения — неверная универсальная процедура."], ["PTFE", "Политетрафторэтилен и его композиции обладают хорошей химической стойкостью для многих сред и низким трением, но имеют ограничения по температуре, давлению, ползучести и конкретной химии. Наполнитель меняет свойства. Обозначение PTFE само по себе не подтверждает пригодность набивки для любого кислорода, пищевого продукта или агрессивной смеси. Нужны марка и подтверждённые условия."], ["Графит и арамид", "Графитовые решения часто используют при повышенных температурах, но надо учитывать окислительную среду, конструкцию и требования к выбросам. Арамидные волокна могут придавать механическую стойкость композициям; совместимость с поверхностью штока и средой проверяют по конкретной набивке. Цвет набивки не заменяет маркировку и сертификат. Универсальные температурные пределы для всех композиций здесь не назначаются."], ["Сильфонное уплотнение", "Герметичный гибкий металлический элемент отделяет среду от зоны штока. Он уменьшает утечку по подвижному уплотнению в предусмотренной конструкции, но имеет ограниченный ресурс циклов и ограничения по давлению, температуре и ходу. Возможна резервная набивка. Нарушение хода или скручивание сильфона может вывести его из строя; его нельзя обслуживать как обычное кольцо набивки."], ["Замена и подтяжка: организационная логика", "Работу выполняют по руководству конкретного клапана после безопасной подготовки. Проверяют шток, камеру, прижимные детали и совместимость комплекта; устанавливают предусмотренное число, размер и ориентацию элементов, соблюдают заданную процедуру обжатия. После сборки оценивают утечку и ход. Число колец, зазоры, моменты и возможность подтяжки в работе не универсальны; данное пособие не разрешает вмешательство под давлением."], ["Что входит в Repair Kit", "Комплект может включать прокладки, набивку, кольца, уплотнения разгрузки и крепёж — состав зависит от модели и объёма ремонта. Седло и плунжер не всегда входят. Заказывают по модели, серийному номеру, исполнению и ревизии, а не только по DN. Контролируют срок и условия хранения эластомеров, маркировку, совместимость и документальную прослеживаемость."]], "table": [["Симптом", "Возможная причина", "Инженерная проверка"], ["Утечка по штоку", "Набивка / риски / несоосность", "Поверхности, комплект, условия"], ["Рывки после обслуживания", "Чрезмерное трение / сборка", "История обжатия, ход, тренды"], ["Повторный отказ", "Неустранённое повреждение штока", "Размеры, шероховатость по чертежу"]], "task": "После замены набивки наружная утечка исчезла, но положение стало меняться скачками. Что это означает?", "answer": "Герметизация могла сопровождаться ростом трения. Проверяют процедуру и совместимость комплекта, состояние штока и направляющих, соосность, настройку привода и тренды. Утечка и качество регулирования — независимые критерии; исчезновение одного симптома не завершает приёмку.", "checks": ["Почему низкое трение важно для регулирования?", "Чем сильфон отличается от набивки?", "Как идентифицировать ремонтный комплект?"]}, {"title": "Приводы, ручной дублёр и безопасное положение", "hours": 10, "goal": "Различать управляющее действие, нормальное состояние и реакцию на каждый отказ.", "sections": [["Пневматическая мембрана и поршень", "Давление воздуха на эффективную площадь создаёт усилие; в пружинном приводе оно уравновешивается пружиной и нагрузками. Мембранные приводы часто имеют небольшое трение и применяются для регулирования; поршневые позволяют получать большие усилия и разные схемы действия. Это не жёсткое разделение. Двусторонний привод требует управления обеими полостями и не получает безопасного положения автоматически."], ["Электрический и гидравлический", "Электропривод преобразует вращение двигателя через передачу, использует ограничения хода и момента по конструкции. При потере сети он может остановиться, но гарантированное удержание или аварийный ход требуют подтверждённого исполнения. Гидропривод даёт большие усилия при компактности, но требует исправной гидросистемы и учёта утечек. Пружины, аккумуляторы и резервное питание — отдельные элементы функции безопасности."], ["Не путать НО/НЗ с направлением воздуха", "Air-to-open означает, что управляющее давление вызывает открытие; air-to-close — закрытие в описанной конфигурации. НО и НЗ обычно описывают нормальное состояние устройства при оговорённом отсутствии воздействия, особенно у соленоидов. Обозначения могут использоваться неоднозначно, поэтому в документации пишут словами: «при потере управляющего воздуха клапан закрывается». Это точнее двух букв."], ["Fail-open, fail-close, fail-in-place", "Это ожидаемое положение при конкретном отказе. Отдельно рассматривают потерю воздуха, электричества, входного сигнала и отказ позиционера: результаты могут различаться. Пружина может обеспечить ход при потере воздуха только при достаточном усилии и исправной схеме. Блокировка полостей даёт удержание с ограничениями утечек, не вечное сохранение положения. Ресивер обеспечивает конечный запас энергии, который рассчитывают и контролируют."], ["Соленоиды и быстрое действие", "Электромагнитный клапан может непосредственно управлять небольшим потоком или распределять воздух привода. Прямого действия и пилотные конструкции различаются: пилотной может требоваться минимальный перепад. Соленоид в навеске не обязательно является самим технологическим регулирующим клапаном. Быстрый сброс ускоряет разряд полости, но слишком быстрое закрытие может вызвать гидроудар; время задаётся проектом."], ["Ручной дублёр", "Маховик может быть верхним, боковым, встроенным в передачу; в зависимости от конструкции он выполняет ручное перемещение или ограничивает ход. Перед автоматической работой его переводят в предусмотренное нейтральное положение и проверяют отсутствие ограничений. Нельзя преодолевать заклинивание чрезмерным усилием и включать несовместимые режимы одновременно. Порядок переключения берут из руководства."], ["Матрица отказов", "Для каждого источника энергии запишите: что теряется, как переключается навеска, какая энергия остаётся, конечное положение, время и способ подтверждения. Проверка хода безопасности на объекте может менять процесс и выполняется только по согласованной программе. Надпись Fail Close не доказывает функцию при заедании или обрыве механической связи."]], "table": [["Привод", "Плюс", "Ограничение"], ["Мембранный пневматический", "Простая передача усилия, пружинные исполнения", "Нужны воздух и проверка усилия"], ["Поршневой", "Высокие усилия, гибкая схема", "Трение, уплотнения, схема отказа"], ["Электрический", "Не нужна воздушная сеть", "Режим работы, защита, резерв для аварийного хода"], ["Гидравлический", "Высокая силовая плотность", "Гидростанция, утечки, накопленная энергия"]], "task": "При потере сигнала клапан закрывается, а при потере воздуха остаётся примерно на месте. Можно ли назвать его просто НЗ?", "answer": "Такое обозначение скрывает различия. Нужна матрица отказов с описанием схемы: как реагируют позиционер, соленоид, запорные блоки и привод на каждый отказ. Требуемое безопасное положение устанавливает проект; приблизительное удержание не подтверждает гарантированное Fail-in-place.", "checks": ["Что означает air-to-open?", "Почему быстрое закрытие не всегда безопаснее?", "Как ручной дублёр может вызвать неполный ход?"]}, {"title": "Позиционеры: обратная связь, ноль и диапазон", "hours": 10, "goal": "Понимать настройку без подмены механических неисправностей электронной коррекцией.", "sections": [["Зачем нужен позиционер", "Он сравнивает заданное положение с измеренным и меняет воздействие на привод так, чтобы уменьшить ошибку. Поэтому одинаковый входной сигнал может потребовать разного давления в приводе при изменении трения и нагрузки. Позиционер управляет положением, но сам по себе не гарантирует точный расход и герметичность."], ["Три исполнения", "Пневматический принимает пневмосигнал и механически либо пневматически сравнивает его с положением. Электропневматический преобразует электрический сигнал и управляет воздухом. Цифровой использует электронный алгоритм и датчики, может хранить диагностику и поддерживать связь. Наличие цифрового интерфейса не доказывает исправность механики и качества воздуха."], ["Сигнал 4–20 мА: пример", "При линейном назначении 4 мА → 0%, 20 мА → 100% команда 12 мА соответствует 50% хода: (12−4)/16 = 0,5. Это не означает 50% расхода. При обратном действии или split-range связь иная и должна быть настроена явно. Значение в АСУ и фактический ток на входе могут различаться из-за масштаба, цепи или конфигурации."], ["Ноль и span", "Ноль определяет начальную точку соответствия входа и хода, span — диапазон между конечными точками. До калибровки проверяют механическую связь, допустимый ход, направление действия, ограничители и комплектность. Нельзя компенсировать неправильную длину связи или механическое препятствие настройкой span. Для поворотной и линейной кинематики действуют разные требования крепления датчика."], ["Организация настройки", "Настройку выполняют по руководству на подготовленном стенде либо по разрешённой программе на объекте. Входные данные: модель, версия, диапазон сигнала, ход, действие, пределы давления и требуемое безопасное положение. Автокалибровка часто вызывает полный ход: её нельзя запускать на действующем процессе без разрешения. После изменения фиксируют конфигурацию и проверяют предусмотренные режимы."], ["Диагностические графики", "Полезны зависимости команда–ход и давление–ход, времена движения, тревоги, накопленные циклы и тренды питания. Для сравнения нужны одинаковые условия и исходная базовая запись. Порог диагностической программы — подсказка, а не окончательное доказательство дефекта: изменение процесса может сдвинуть график без поломки позиционера."], ["Пример неисправности", "Задание растёт 40→45→50%, фактический ход остаётся 40%, затем прыгает к 52%; давление перед скачком растёт. Это согласуется с преодолением статического трения, но требует проверки датчика положения, питания и механики. Перенастройка усиления без анализа способна лишь замаскировать симптом или создать колебания."]], "table": [["Этап", "Проверяем", "Нельзя подменять"], ["Механика", "Монтаж и полный допустимый ход", "Ошибку связи корректировкой шкалы"], ["Вход", "Фактический сигнал и действие", "Команду АСУ предположением о токе"], ["Выход", "Питание и реакцию привода", "Неисправный воздух заменой электроники"], ["Приёмка", "Ход, повторяемость, отказные состояния", "Прохождение автонастройки допуском"]], "task": "На АСУ 50%, ток 12 мА, а шток показывает 80%. Как построить диагностику?", "answer": "Уточнить ожидаемую характеристику сигнал–ход и действие, диапазоны и split-range; проверить измерение хода и связь; сопоставить фактическую конфигурацию и механические ограничения. Расходную характеристику не использовать как объяснение ошибки положения: это другая зависимость.", "checks": ["Что позиционер измеряет непосредственно?", "Почему автонастройка опасна на действующей установке?", "В чём разница между ходом 50% и расходом 50%?"]}, {"title": "ГОСТы, P&ID и карта нормативных требований", "hours": 8, "goal": "Связывать требования, схемы и идентификацию реального оборудования.", "sections": [["Документальная цепочка", "Начинайте с тега на P&ID и заводского номера. Затем связывайте спецификацию проекта, паспорт, руководство, чертежи, сертификаты/декларации по применимости и историю ремонтов. Документ без идентификации исполнения может относиться к другой модификации. Универсальная инструкция для линейки не заменяет параметры конкретного изделия."], ["Как читать P&ID", "Технологическая схема показывает связь аппаратов, трубопроводов, измерений и исполнительных элементов, но не все монтажные подробности. Например, FIC-101 может обозначать регулятор расхода, а FV-101 — связанный клапан по принятой системе обозначений. Символы линий сигналов, привода и безопасного положения читают по легенде проекта. Одни и те же буквы нельзя трактовать без неё."], ["Пример контура", "Условная цепочка: измеритель расхода FT-101 → регулятор FIC-101 → позиционер FY-101 → клапан FV-101. Здесь FY — только учебное обозначение по заданной легенде; реальный проект может применять другое. При колебаниях проверяют также измеритель и регулятор. P&ID помогает найти байпас и отсекающие устройства, но безопасную схему отключения разрабатывают по процедурам объекта."], ["Роли стандартов", "ГОСТ 24856-2014 — термины. ГОСТ 12893-2005 — общие технические условия для односедельных, двухседельных и клеточных регулирующих клапанов в его области. ГОСТ 9544-2015 — нормы герметичности затворов. ГОСТ 33257-2015 — методы контроля и испытаний. ГОСТ 33259-2015 — фланцы. ГОСТ 34437-2018 — экспериментальное определение гидравлических и кавитационных характеристик. ГОСТ 12.2.063-2015 — безопасность. Название и область каждого документа важнее привычки ссылаться на один номер для всего."], ["Изменения и применимость", "В доступной публикации ГОСТ 12893-2005 указано изменение №1, введённое в РФ с 01.03.2024; публикация ГОСТ 34437-2018 также отмечает изменение №1. Это показывает необходимость контроля версий, а не подтверждает окончательную актуальность комплекта. Перед рабочим применением проверяют официальный статус, изменения и территорию. Производственные испытания и испытания после ремонта не следует объявлять идентичными автоматически."], ["ГОСТ, РД, регламент и договор", "Обязательность конкретного требования зависит от законодательства, области объекта, проекта и договора. Для оборудования под давлением может быть применим ТР ТС 032/2013, но его применимость и категория требуют отдельного определения. Отраслевые РД выбирают после уточнения отрасли; случайный РД не становится обязательным для всей арматуры. При противоречии оформляют запрос ответственному, а не выбирают удобную норму."], ["Карта требований", "Строка карты: объект → параметр → критерий → документ/редакция/пункт → метод → результат → ответственный. Если источник критерия не найден, записывают «не определён» и останавливают решение о соответствии. В библиотеке приложения есть ссылки и указания по применению; она не является официальной нормативной базой и не воспроизводит все таблицы ГОСТов."]], "table": [["Документ", "Инженерный вопрос", "Типичная ошибка"], ["ГОСТ 9544", "Как нормируется пропуск?", "Использовать класс без условий"], ["ГОСТ 33257", "Как организовать контроль?", "Принять метод за требуемый класс"], ["ГОСТ 33259", "Какие фланцы и размеры?", "Получать момент затяжки только по DN"], ["Руководство", "Что допускает изготовитель?", "Использовать документ другой ревизии"]], "task": "В ремонтном акте написано «испытано по ГОСТ», без номера и условий. Какие записи потребовать?", "answer": "Идентификацию изделия, вид проверки, документ с редакцией и пунктом, критерий, фактические параметры, среду, время, схему, средства измерений и результат. Также основание применимости программы к ремонту и подписи ответственных. Само слово ГОСТ не делает запись проверяемой.", "checks": ["Почему нужна легенда P&ID?", "Чем норма герметичности отличается от метода проверки?", "Как подтвердить редакцию документа?"]}, {"title": "Безопасность, наряд-допуск и особые среды", "hours": 8, "goal": "Выявлять опасности и проверять организационную готовность до вмешательства.", "sections": [["Какие энергии учитывать", "Помимо давления рабочей среды существуют электрическое питание, управляющий воздух, гидравлика, пружины, груз и накопленная механическая энергия. Отключение электропривода не снимает давление из трубопровода. Сброс воздуха не гарантирует отсутствия усилия пружины. Опасное состояние оценивают для всего узла."], ["Изоляция и подтверждение", "Работы ведутся по процедурам объекта: с установленными границами, ответственными, разрешениями, блокировкой источников и подтверждением безопасного состояния. Закрытая арматура сама по себе не является универсально достаточной изоляцией. Манометр с нулевым показанием может быть неисправен или отделён от полости засорённым каналом. Способ подтверждения определяют утверждённые процедуры, а не этот учебный материал."], ["Остаточная среда и температура", "В полостях могут оставаться токсичные, горючие или агрессивные вещества. Наружная поверхность может остыть раньше внутреннего объёма. Учитывают совместимость очистки и обезвреживания, вентиляцию, необходимые анализы и обращение с отходами по правилам объекта. До установления безопасных условий разборку не начинают."], ["Приводы и стенды", "Перемещение привода создаёт зоны защемления; при снятии узлов возможны падение и смещение центра тяжести. На испытательном стенде опасны разрушение элементов и выброс среды. Пневматические испытания связаны с накоплением энергии сжатого газа и требуют специальных мер по применимой процедуре. Не заменяйте испытательную среду самостоятельно."], ["Правило остановки", "Если идентификация изделия, границы отключения, состояние энергии или программа проверки неясны, инженер приостанавливает работу и эскалирует вопрос ответственному. Срок заказа не является основанием для снятия барьеров безопасности. При опасной утечке действуют по аварийной процедуре, а не продолжают учебную диагностику."], ["Наряд-допуск: содержание", "Конкретная форма определяется правилами объекта. В ней фиксируют границы и состав работ, оборудование, опасности, подготовительные меры, роли допускающего и исполнителей, условия начала, приостановки и завершения. Блокировки и плакаты применяют по локальной системе исключения ошибочного включения. Учебный чек-лист не подменяет оформленный наряд. При изменении условий работы пересматривают, а не продолжают автоматически."], ["Кислород и специальные требования чистоты", "Для кислородных сред опасны загрязнения, способные воспламениться; применяются специальные требования к материалам, обезжириванию, подтверждению чистоты, упаковке и инструменту. Не используйте бытовые растворители и обычную смазку по аналогии. Для пищевых сред важны пригодность материалов, санитарная обработка и отсутствие застойных зон; для чистых процессов — частиц и недопустимых примесей. Универсальная процедура очистки для всех трёх случаев невозможна."], ["Проверка понимания на примере", "Клапан снят с процесса, но на складе не указана прежняя среда. Начинать разборку как «обычной воды» нельзя: требуется идентификация, оценка остатков и документированная подготовка. Отсутствие запаха не подтверждает отсутствие опасности. Неизвестность — основание остановить этап, а не экспериментировать."]], "table": [["Опасность", "Ошибочное предположение", "Организационный барьер"], ["Остаточное давление", "Команда «закрыть» всё устранила", "Изоляция и подтверждение по процедуре"], ["Пружинный привод", "Нет воздуха — нет энергии", "Учёт накопленной механической энергии"], ["Опасная среда", "Пустой трубопровод безопасен", "Подготовка и подтверждение по правилам объекта"]], "task": "Перед демонтажом электропривод обесточен, манометр показывает ноль. Достаточно ли этих сведений для начала разборки?", "answer": "Нет. Не подтверждены границы изоляции, надёжность контроля давления, остатки среды, температура, другие источники энергии, разрешения и безопасное положение узлов. Требуется выполнение процедуры объекта ответственными лицами; учебная оценка не выдаёт разрешение.", "checks": ["Какие виды энергии остаются после отключения электричества?", "Почему нулевое показание манометра не всегда достаточно?", "При каких неопределённостях нужно остановить работу?"]}, {"title": "Фланцы: совместимость, сборка и повторные утечки", "hours": 8, "goal": "Оценивать совместимость соединения и устанавливать причины повторной утечки.", "sections": [["Совместимость соединения", "Сравнивают типы фланцев, номинальные размеры и давления, присоединительные размеры, исполнение уплотнительных поверхностей, материалы и допустимость в заданных условиях. Нельзя ориентироваться только на число отверстий и возможность вставить болты. Ответные поверхности и прокладка должны образовывать предусмотренную конструкцией пару."], ["Как работает прокладка", "Герметизация зависит от контактного давления и состояния поверхностей. Недостаточное обжатие может не обеспечить уплотнение, чрезмерное — повредить прокладку или соединение. В эксплуатации контакт меняется из-за температуры, релаксации, ползучести и внешних нагрузок. Материал выбирают по среде, температуре, давлению и конструкции; одинаковая толщина не означает эквивалентность."], ["Что осматривать", "Проверяют коррозию, забоины, радиальные риски, деформацию, загрязнение и состояние опорных поверхностей. Значимость дефекта устанавливают по ремонтным критериям. Самовольная шлифовка может изменить размеры, геометрию и качество поверхности. Нельзя считать любую видимую риску браком или, наоборот, устранять её без измерения."], ["Крепёж и затяжка", "Материал, размер, покрытие, состояние резьбы, смазка и порядок затяжки влияют на получаемое усилие. Одинаковый момент при разных условиях трения не даёт одинакового натяжения. Значения и последовательность берут из утверждённой процедуры или согласованного расчёта. Повторное использование прокладок и крепежа допускается только когда это предусмотрено применимыми требованиями."], ["Нагрузки от трубопровода", "Несоосность и внешние нагрузки могут нарушать распределение контактного давления. Попытка стянуть несоосные фланцы крепежом способна скрыть проблему и создать недопустимые напряжения. Повторная течь после смены прокладки требует исследования всего соединения и опор трубопровода, а не очередного увеличения момента."], ["Пример несовместимости", "Два фланца подходят по отверстиям, но имеют разные уплотнительные поверхности или не соответствуют прокладке. Возможность физически стянуть их не является подтверждением герметичного и прочного соединения. До сборки сопоставляют полные обозначения, чертежи и требования, при необходимости направляют запрос проектировщику."], ["Документирование сборки", "В ремонтной записи указывают фланцы, прокладку, крепёж, применённую процедуру, инструмент и контроль, а не только «болты затянуты». Контролируемая затяжка требует пригодного инструмента и заданных условий; корректный момент на приборе при другой смазке не означает заданное усилие. После ремонта критерии испытания задаются отдельно."]], "table": [["Признак", "Гипотезы", "Нужные данные"], ["Течь после нагрева", "Температурное влияние, релаксация, нагрузки", "Режимы, материалы, история сборки"], ["Локальная утечка", "Повреждение поверхности, неравномерное обжатие", "Карта дефектов и контроль сборки"], ["Повторный отказ прокладки", "Несоответствие, геометрия, внешние нагрузки", "Документация соединения и обследование"]], "task": "Прокладку заменяли дважды. Предложено «дотянуть сильнее». Подготовьте обоснованный ответ и план сбора информации.", "answer": "Не увеличивать момент без основания и не вмешиваться под давлением. После безопасной подготовки проверить совместимость, материал и размеры прокладки, геометрию и поверхности, крепёж, смазку, процедуру сборки, нагрузки и режимы. Сопоставить результаты с применимыми критериями.", "checks": ["Почему момент не равен усилию натяжения напрямую?", "Что нужно кроме DN и PN?", "Какие причины лежат вне прокладки?"]}, {"title": "Утечки и герметичность: как получить достоверный результат", "hours": 8, "goal": "Разделять объекты контроля и корректно интерпретировать результат проверки.", "sections": [["Три разных объекта", "Различают прочность и плотность корпусных деталей, герметичность соединений относительно внешней среды и герметичность затвора. Исправный корпус не гарантирует герметичный затвор. Отсутствие внешней течи не доказывает отсутствие внутреннего пропуска. В протоколе точно указывают, что проверялось."], ["Нормирование утечки", "Требование устанавливают для конкретного изделия и условий применения. Класс герметичности и критерий берут из применимых документов. Для регулирующей арматуры допустимый пропуск может отличаться от ожиданий пользователя запорной арматуры. Не назначайте класс по внешнему виду седла и не переносите значение из чужого паспорта."], ["Условия измерения", "Фиксируют испытательную среду, давления, температуру, направление подачи, положение затвора, выдержку, длительность контроля и способ измерения. Результаты, полученные разными методами и при разных условиях, нельзя автоматически сравнивать. Пузырьки, капли и объёмный расход не взаимозаменяемы без установленной методики."], ["Исключение ложного вывода", "В испытательной схеме могут быть байпасы, негерметичные краны и присоединения. Изменение температуры и сжимаемость влияют на давление. Ошибка прибора может быть значимой при малых расходах. Сначала подтверждают чувствительность и исправность схемы и путь утечки, затем связывают измерение с затвором."], ["Метрология", "Проверяют диапазон, разрешение, точность, пригодность и статус средств измерений. Нельзя достоверно подтвердить малую утечку прибором, который её не различает. Пограничный результат оценивают по установленным правилам принятия решения, учитывая характеристики метода, а не округляют в удобную сторону."], ["Как оформить вывод", "Запишите фактический результат с единицами и условиями, нормативный предел и источник, идентификацию изделия, схему и средства измерений. Формулировка «не течёт» без метода и условий непроверяема. При неоднозначности результат не объявляют соответствующим автоматически."], ["ГОСТ 9544: как читать без опасных сокращений", "Документ устанавливает нормы и классы герметичности затворов. В доступном тексте его область охватывает разные виды и типы арматуры; для регулирующей арматуры предусмотрено понятие относительной утечки. Но буквенное обозначение класса без вида арматуры, метода и условий не является достаточной спецификацией. Не приравнивайте автоматически классы по ГОСТ, IEC и ANSI/FCI: требования и условия сопоставляют отдельно."], ["Пример расчёта относительной утечки", "Условно для учебной задачи задано: Kvs = 40 м³/ч, допустимая относительная утечка 0,01%, контроль выполняется в согласованных с критерием условиях. Тогда Qlim = 40 × 0,01/100 = 0,004 м³/ч = 4 л/ч. Это НЕ назначение реального класса ГОСТ и не разрешение испытывать любое изделие при таких условиях. Процент должен быть взят из применимого требования, а условия должны соответствовать его определению."], ["Пример пограничного измерения", "Норма по документу 4 л/ч, прибор показывает 3,9 л/ч, но характеристики метода и неопределённость не оценены. Простое округление вниз не обосновывает соответствие. Уточняют пригодность прибора, повторяемость и установленное правило принятия решения. Нельзя выбирать правило после получения результата, чтобы «прошло»."]], "table": [["Наблюдение", "Не доказано", "Следующая инженерная задача"], ["Падает давление", "Дефект именно затвора", "Проверить схему, температуру, измерение"], ["Нет наружной течи", "Герметичность седла", "Назначить отдельную проверку затвора"], ["Показание около нуля", "Утечка отсутствует", "Проверить разрешение и чувствительность"]], "task": "Зафиксирован внутренний пропуск. Испытательная среда и перепад в записи отсутствуют. Можно ли заключить, что требуемый класс не обеспечен?", "answer": "Нет достаточных данных для обоснованного сравнения с нормой. Нужно установить применимый критерий, условия и достоверность измерения, исключить альтернативный путь. Пропуск — наблюдение, а заключение о соответствии требует установленной процедуры.", "checks": ["Какие условия обязательны в протоколе?", "Как отличить наружную утечку от пропуска?", "Почему нулевое показание не равно доказанному отсутствию утечки?"]}, {"title": "Диагностика без демонтажа: сигналы, шум, вибрация", "hours": 10, "goal": "Строить дерево причин и выбирать проверки, которые различают гипотезы.", "sections": [["Уточняем симптом", "Фразы «не работает» или «не держит» недостаточны. Определите режим, момент возникновения, повторяемость, фактический ход, сигналы, параметры процесса и историю. Уточните, по какому признаку заказчик судит о неисправности. Если поток идёт по байпасу, ремонт седла не устранит наблюдение."], ["Нет полного хода", "Проверяют гипотезы о питании, настройках привода, механическом ограничении, загрязнении и повреждении передачи. Сравнивают команду, движение привода и фактическое положение штока или вала допустимым способом. Не увеличивают момент и не обходят защиту без инженерного основания: можно превратить диагностируемый отказ в разрушение."], ["Ход есть, пропуск остаётся", "Возможны повреждение уплотняющих поверхностей, посторонние частицы, недостаточное посадочное усилие, неверная настройка или условия подачи. Сначала подтверждают путь утечки и фактическое закрытие, затем планируют дефектацию. Одинаковое проявление не означает одинакового ремонта для клиновой задвижки и шарового крана."], ["Повышенный момент", "Причинами могут быть трение, коррозия, деформация, несоосность, перепад давления и особенности конструкции. Сопоставляйте момент или его доступный индикатор с положением и режимом. Изменение по ходу часто информативнее одного максимума. Данные привода не всегда являются прямым измерением усилия на затворе."], ["Диагностическое решение", "Полезная проверка должна давать разные ожидаемые результаты для разных гипотез. Запишите: гипотеза, ожидаемый признак, безопасный метод проверки, результат и вывод. Если доступной проверкой причины не разделяются, честно обозначьте неопределённость и необходимость следующего этапа."], ["Последовательность без вмешательства", "Первый этап — сбор уже доступной информации: паспорт, P&ID, архив трендов, события, параметры и история ремонта. Сопоставляют команду, ход, расход, давления и время. Дополнительные измерения, подключение приборов и любые тестовые воздействия — только по утверждённой программе с оценкой рисков. «Без демонтажа» не означает «безопасно без разрешения»."], ["Ток и воздух: практический пример", "На АСУ команда 80%, но фактический ток соответствует 30%; неисправность может находиться в выходном канале, масштабировании или цепи. Если сигнал корректен, а давление питания проседает при движении, исследуют воздушную сеть, фильтр и пропускную способность навески. Если питание стабильно, давление в полости растёт, но ход задерживается, усиливается гипотеза о трении или нагрузке. Ни одна ветка не исключает проверки измерительного канала."], ["Медленное срабатывание и дребезг", "Медленный ход бывает связан с ограничением расхода воздуха, настройками, утечкой привода, вязкостью и механикой. Дребезг может возникать из-за гидродинамических сил, люфта, неустойчивого управления или резонанса. Записывают времена по направлению, условия давления, момент возникновения и частоту. Замена детали без такой локализации часто не устраняет повторение."], ["Акустика и вибрация", "Контактный ультразвук, акустика и вибрационные измерения могут локализовать изменение состояния, если соблюдены методика и безопасный доступ. Результаты зависят от фонового потока, крепления датчика, материала и режима. Сравнивать «громкость на слух» с нормативной утечкой нельзя. Приборная диагностика даёт дополнительное свидетельство, не универсальную количественную оценку расхода через седло."]], "table": [["Симптом", "Группа причин", "Какие данные различают причины"], ["Нет движения", "Питание / управление / механика", "Команда, состояние питания, фактическая реакция"], ["Неполный ход", "Настройка / препятствие / повреждение", "Профиль движения и ограничения по документации"], ["Ход полный, есть пропуск", "Седло / усилие / схема", "Путь утечки, условия, настройка и дефектация"]], "task": "Концевик показывает «закрыто», но потребитель получает среду. Назовите минимум четыре гипотезы и порядок уточнения исходных данных.", "answer": "Возможны неверная настройка концевика, неполное фактическое закрытие, дефект седла, обходной путь, иной источник подачи или ошибка наблюдения. Начать с безопасного сбора схемы, режимов, истории и достоверности сигналов; затем составить программу различающих проверок.", "checks": ["Как отличить симптом от причины?", "Почему повышение момента не является методом по умолчанию?", "Что делает проверку диагностически полезной?"]}, {"title": "Демонтаж, дефектация, ремонт и установка", "hours": 12, "goal": "Принимать прослеживаемые решения о восстановлении или замене деталей.", "sections": [["Подготовка к дефектации", "После безопасной подготовки идентифицируют изделие и детали, фиксируют исходное состояние и маркировку. Очистку выбирают так, чтобы не уничтожить значимые признаки и не повредить материал. Фотографии до очистки помогают исследовать распределение загрязнений и продуктов коррозии."], ["Механизмы повреждения", "Коррозия связана с взаимодействием материала и среды, эрозия — с воздействием потока и частиц; износ может быть контактным. Морфология помогает поставить гипотезу, но одна фотография не заменяет обследование. Важно найти источник: например, смена повреждённой клетки не исключает повторного разрушения при сохранении неблагоприятного режима."], ["Измерения и критерии", "Ведомость должна содержать не «износ значительный», а место, измеренное значение, метод, допустимое значение и источник. Проверяют пригодность измерительного средства и доступ к базе измерения. Если ремонтный предел не установлен, вопрос передают на разработку или согласование решения; универсальный процент допустимого износа не назначают."], ["Контроль материала", "Методы неразрушающего контроля выбирают по материалу, геометрии и искомым дефектам. У каждого метода есть ограничения, а выполнение и заключение требуют соответствующей квалификации. Отсутствие индикаций одним методом не является доказательством отсутствия всех возможных дефектов."], ["Выбор ремонта", "Возможны замена, предусмотренное восстановление или вывод изделия из применения. Притирка, механическая обработка, наплавка и сварка не являются универсально допустимыми. Они могут менять геометрию, свойства материала и ресурс. Требуются утверждённая технология, критерии контроля и последующей приёмки."], ["Сборка и прослеживаемость", "Фиксируют установленные детали и материалы, документы комплектующих, выполненные операции и исполнителей. Проверяют настройки, ход и соответствие комплектации. Нельзя скрывать изменение материала под формулировкой «аналог»: замена должна быть обоснована и согласована."], ["Порядок работ: контрольные точки", "1. Идентификация и согласованный объём. 2. Подготовка безопасного состояния по процедуре объекта. 3. Документированный демонтаж с учётом массы и опор. 4. Фотофиксация и разборка по руководству. 5. Очистка и дефектация. 6. Согласованное решение. 7. Сборка и настройка. 8. Контроль и испытания. 9. Защита от загрязнения, установка и ввод по процедурам. Это логика маршрута, а не инструкция по отворачиванию крепежа конкретного изделия."], ["Коррозия, эрозия, налипание", "Равномерное уменьшение толщины, локальные язвы, направленные следы потока и отложения описывают раздельно. Коксование и полимеризация могут ограничивать ход и менять проходное сечение; очистка устраняет следствие, но нужно проверить температуру, время пребывания и свойства среды. Состав отложений и механизм повреждения подтверждают подходящими исследованиями. Неизвестный осадок рассматривают с точки зрения безопасности до контакта и очистки."], ["Чистота и соосность", "Посторонняя частица на седле способна дать пропуск даже у новых деталей. Неверная соосность штока, направляющих и привода увеличивает трение. При сборке контролируют геометрию и чистоту по документации, сохраняют соответствие деталей и ориентацию. Нельзя добиваться свободы хода снятием металла без установленного допуска."], ["Установка на объекте", "Проверяют исполнение, направление потока, монтажное положение, опоры, допустимость нагрузок и присоединений, конфигурацию навески, сигнализацию и ручной режим. Трубопровод не должен становиться приспособлением для исправления геометрии корпуса. Возврат на место не равен завершённому вводу: необходимые функциональные проверки определяет программа объекта."]], "table": [["Запись", "Проблема", "Как улучшить"], ["Седло плохое", "Нет измерения и критерия", "Указать дефект, размеры, допуск и источник"], ["Заменить на аналог", "Нет обоснования эквивалентности", "Сравнить материалы, геометрию, режимы, согласовать"], ["Трещин нет", "Неясен объём контроля", "Указать метод, зону, условия и ограничения"]], "task": "У штока выявлены риски; ремонтный допуск не найден. Можно ли разрешить полировку по опыту прошлого ремонта?", "answer": "Без проверки применимости такого решения — нет. Требуются идентификация материала и покрытия, измерения, требования к диаметру и поверхности, совместимость с уплотнением и документированное согласование допустимого восстановления. Опыт формирует гипотезу, но не заменяет критерий.", "checks": ["Чем дефектная ведомость отличается от списка жалоб?", "Почему нельзя назначить универсальный процент износа?", "Какие изменения требуют согласования?"]}, {"title": "Испытания после ремонта и техническое заключение", "hours": 10, "goal": "Связать выполненный ремонт с доказательствами соответствия и ограничениями результата.", "sections": [["Программа контроля", "До испытаний определяют объект, цель, применимые документы, последовательность, условия, критерии и ответственных. Не все проверки взаимозаменяемы: проверка хода не подтверждает прочность, а проверка корпуса не подтверждает затвор. Параметры нельзя назначать единой множительной формулой для любого изделия."], ["Готовность стенда", "Подтверждают соответствие схемы утверждённой программе, пригодность оборудования и средств измерений, наличие необходимых защит и безопасных условий. Проверяют возможности метода по ожидаемому диапазону. Для нетиповой комплектации заранее решают, какие испытания выполняются в сборе и как фиксируются ограничения."], ["Регистрация результата", "В протокол включают идентификацию изделия, состав узла, документы, дату, метод, фактические параметры, время, средства измерений и результаты. Рядом с результатом должен находиться критерий с источником. Значение без единиц или запись «норма» вместо измерения затрудняют проверку и сравнение в будущем."], ["Техническое заключение", "Разделяйте факты, интерпретацию и рекомендации. Укажите подтверждённые дефекты, выполненный ремонт, результаты контроля, оставшиеся ограничения и необходимость дополнительных действий. Утверждение о причине отказа должно иметь доказательства. Если причина не установлена, это прямо записывают, а не подменяют предположением."], ["Возврат в эксплуатацию", "Успешный стендовый результат относится к зафиксированным условиям и не является бессрочной гарантией всех режимов. Перед вводом действуют процедуры объекта, проверяют монтаж, настройки и требования проекта. Решение принимают уполномоченные лица; приложение не оформляет допуск."], ["Итоговая работа — 8 часов из модуля", "Получите карточку изделия и жалобу, запросите недостающие данные, сформируйте гипотезы, предложите проверки, заполните дефектную ведомость, обоснуйте ремонт и программу приёмки. На защите оценивают не угадывание причины, а безопасность, доказательность, работу с документами и честное указание неопределённостей."], ["Прочность, плотность, наружная герметичность, затвор", "Это разные цели испытаний. Прочность — способность выдержать предусмотренное испытательное воздействие по критериям документа; плотность — отсутствие недопустимого проникновения через материал; внешняя герметичность — соединения и уплотнения; герметичность затвора — разобщение полостей. Для каждой цели свои условия и признаки. Слово «опрессовка» без уточнений не определяет полный объём приёмки."], ["Какие среды и давления используются", "Гидравлические испытания часто выполняют подходящей жидкостью, пневматические — предусмотренным газом, но выбор делается программой и применимыми документами с учётом материала, чистоты и рисков. Для воды могут требоваться ограничения состава и последующая сушка; для кислородного исполнения — особая подготовка. Конкретное давление, температура и выдержка зависят от изделия, вида испытания, материала и нормативного основания. Формулу «всегда 1,5 PN» в качестве инструкции не используем."], ["Заполненный учебный фрагмент протокола", "Изделие: учебный FV-101, заводской номер УЧ-001. Проверка: герметичность затвора. Основание: учебная спецификация УС-01, пункт 3; критерий 4 л/ч при условиях, заданных спецификацией. Результат 2,8 л/ч; среда, давления, температура, выдержка и прибор должны быть перечислены отдельно. Вывод допустим только после подтверждения полноты условий и пригодности метода. Пример не воспроизводит норму реального ГОСТ для данного тега."], ["Что делать при отрицательном результате", "Регистрируют несоответствие, проверяют достоверность схемы и измерений, анализируют причины, согласуют корректирующие действия и повторный объём контроля. Нельзя скрывать неудачный тест заменой записи или выборочным предъявлением удачного прогона. История отрицательных результатов важна для анализа повторяемого отказа."]], "table": [["Раздел заключения", "Содержание", "Не допускается"], ["Исходные данные", "Изделие, режимы, жалоба, документы", "Неидентифицированная арматура"], ["Результаты", "Измерения, условия, критерии", "Вывод без основания"], ["Решение", "Ремонт, ограничения, подпись ответственного", "Учебный балл вместо допуска"]], "task": "Составьте итоговый пакет по клапану с повторной утечкой: карточка, гипотезы, программа диагностики, дефектная ведомость, ремонтное решение и проект протокола.", "answer": "Критерии оценки: изделие идентифицировано; риски и границы работ указаны; гипотезы различимы; значения имеют источники; ремонт допустим; программа проверки покрывает выявленные дефекты; факты отделены от предположений; ограничения и полномочия обозначены. Наставник отдельно оценивает практические навыки.", "checks": ["Что стендовый результат доказывает, а что нет?", "Чем факт отличается от интерпретации?", "Какие сведения позволяют повторить проверку?"]}, {"title": "Практикум: пять случаев с пошаговым разбором", "hours": 12, "goal": "Соединять теорию, расчёт и диагностику в обоснованное решение.", "sections": [["Кейс 1. Клапан не перекрывает поток", "Дано: команда 0%, датчик показывает закрытие, потребитель регистрирует расход. Шаг 1 — подтвердить, откуда приходит поток, проверить схему байпасов по документации. Шаг 2 — оценить достоверность сигнала положения и требуемое направление. Шаг 3 — собрать условия и критерий проверки затвора. Шаг 4 — по разрешённой программе разделить неполный ход, недостаточное усилие и повреждение седла. Разборка до подтверждения пути утечки рискует оказаться ненужной. Результат: перечень фактов, гипотез и различающих проверок, а не преждевременный заказ седла."], ["Кейс 2. Колебания после замены набивки", "Дано: до ремонта ход плавный, после него возникли задержки и скачки. Сравниваем синхронные тренды задания и хода, доступных давлений, историю настройки и комплект набивки. При стабильном задании и скачках хода исследуем исполнительный узел; при колеблющейся команде включаем анализ контура. Временная связь с ремонтом усиливает гипотезу трения, но не доказывает её. Итог ремонта должен подтвердить и наружную герметичность, и качество движения."], ["Кейс 3. Выбор Kvs по режимам", "Дано для условной воды: 5 м³/ч при 2 бар, 20 при 1 бар, 30 при 0,5 бар. Kv равны 3,54; 20; 42,43. Для условного Kvs = 50 доли k равны 0,071; 0,4; 0,849. Для линейной идеализации это примерно 7,1%, 40%, 84,9% хода; для модели равнопроцентной R = 50 расчёт h = 1 + ln(k)/ln(50) даёт около 32,3%, 76,6%, 95,8%. Реальный выбор требует кривой изготовителя, ограничения минимального хода, запаса и проверки предельных режимов. Пример показывает, почему одного Kvs мало."], ["Кейс 4. Шум и повреждение клетки", "Дано: шум возрастает с перепадом, после ремонта снова повреждены окна. Собираем абсолютные P1/P2, T, Pv, FL и диапазон расходов; уточняем частицы и конструкцию. Разделяем кавитацию, вскипание, эрозию и механическую вибрацию. Проверяем, не изменился трим и режим процесса. Новая твёрдая деталь может отсрочить отказ, но не устранить неблагоприятное распределение давления. Решение — расчёт и согласованное изменение, а не универсальный совет поставить диффузор."], ["Кейс 5. Медленное аварийное закрытие", "Дано: клапан закрывается при потере сигнала, но медленнее проектного времени. Нужны точная схема навески, тип привода, роль ресивера, соленоида и дросселей, давление и журнал событий. Проверки выполняются только по согласованной программе: изменение времени влияет на процесс и риск гидроудара. Оценивают трение, воздушную пропускную способность, настройки и нагрузку. Установка быстрого сброса без расчёта не гарантирует безопасную функцию."], ["Как оценивать разбор", "За каждый кейс наставник оценивает: понятность симптома; полноту данных; безопасность; несколько проверяемых гипотез; соответствие проверок гипотезам; нормативное основание; ограничения и оформление. Верно названная причина без доказательств не равна качественной диагностике. Практическую часть выполняют на разрешённом стенде по конкретному руководству."]], "table": [["Часть оценки", "Что проверяется", "Результат"], ["Теория", "Понятия, единицы, чтение документа", "Тест и устные объяснения"], ["Практика", "Разборка, дефектация, сборка и настройка", "Лист наблюдения наставника"], ["Аналитика", "Дерево причин, расчёт и решение", "Защита кейса"]], "task": "Выберите любой кейс и оформите полный пакет: исходные данные, недостающие сведения, риски, гипотезы, программа, ожидаемые результаты и проект заключения.", "answer": "Качественная работа отделяет факты от предположений, содержит критерии с источниками, не задаёт неизвестные давления и моменты наугад, учитывает контур и привод, включает очную оценку. Отсутствующие данные явно обозначены. Наставник назначает реальный стендовый случай и проверяет действия отдельно от письменного ответа.", "checks": ["Какое свидетельство опровергнет вашу главную гипотезу?", "Как проверить пригодность измерения?", "Какие решения требуют согласования, а не самостоятельного изменения?"]}];
const $=s=>document.querySelector(s);
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='armatura.training.editor.v4';
let state={done:[],notes:{},best:null},storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==='object'){state.done=Array.isArray(saved.done)?[...new Set(saved.done.filter(x=>Number.isInteger(x)&&x>=0&&x<modules.length))]:[];state.notes=Object.fromEntries(Object.entries(saved.notes||{}).filter(([k,v])=>/^\d+$/.test(k)&&typeof v==='string'));state.best=typeof saved.best==='number'&&saved.best>=0&&saved.best<=100?saved.best:null}}catch(e){storageOK=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){storageOK=false;return false}}
const pages=[['home','Обзор'],['modules','Учебные модули'],['standards','ГОСТы'],['calc','Калькулятор Kv'],['test','Проверка знаний']];
let current='home',activeModule=0;
function nav(page){current=page;$('#nav').innerHTML=pages.map(([k,t])=>`<button data-page="${k}" class="${k===page?'active':''}" ${k===page?'aria-current="page"':''}>${t}</button>`).join('');$('#title').textContent=pages.find(x=>x[0]===page)[1];render();window.scrollTo(0,0)}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)nav(b.dataset.page)});
function render(){if(current==='home')home();if(current==='modules')catalog();if(current==='standards')standards();if(current==='calc')calc();if(current==='test')startQuiz()}
function home(){const chars=modules.reduce((s,m)=>s+m.sections.reduce((n,x)=>n+x[1].length,0),0);$('#view').innerHTML=`<div class="grid"><div class="card"><span class="pill">Расширенная программа</span><div class="stat">${modules.length} модулей · ${modules.reduce((n,m)=>n+m.hours,0)} ч с практикой</div><p>Конструкция, нормы, безопасность, фланцы, гидравлика, утечки, диагностика, ремонт и приёмка.</p></div><div class="card"><span class="pill">Ваш прогресс</span><div class="stat">${state.done.length} / ${modules.length}</div><div class="bar"><span style="width:${state.done.length/modules.length*100}%"></span></div><p>Лучший тест: ${state.best===null?'ещё не пройден':state.best+'%'}</p></div></div><div class="card" style="margin-top:20px"><h2>Подробное пособие по вашему перечню тем</h2><p>Внутри ${modules.reduce((n,m)=>n+m.sections.length,0)} разделов: устройство и подбор, характеристики и авторитет, Kv/Cv, FL, кавитация, уплотнения, приводы, позиционеры, ГОСТы, фланцы, диагностика, ремонт и испытания. Есть расчётные примеры, инженерные таблицы и пять комплексных кейсов. Можно записывать решения и возвращаться к ним позже.</p><p class="muted">Указанные академические часы — проект продолжительности курса, включая практику с наставником. Текст этого файла сам по себе не составляет 150 часов обучения.</p><div class="actions"><button onclick="nav('modules')">Открыть модули</button><button class="secondary" onclick="openLesson(0)">Начать первый урок</button></div></div><div class="notice">${storageOK?'Прогресс и ответы сохраняются в этом браузере. Очистка данных может удалить их.':'Хранилище недоступно. Данные останутся только в памяти страницы.'} Есть встроенный редактор: откройте пункт «Редактор книги». Нет аккаунтов, сервера и передачи ответов наставнику. Это подробный универсальный учебный материал, а не утверждённая инструкция для конкретного оборудования. Нормативные таблицы и полные тексты стандартов не включены. Для материалов старой версии используется отдельный ключ хранения; прежний прогресс не импортируется.</div><button class="secondary" onclick="resetProgress()">Сбросить прогресс</button>`}
function catalog(){ $('#view').innerHTML=`<p class="muted">Выберите урок. Назначенное время включает задания и практику, а не только чтение.</p><label for="search">Поиск по содержанию</label><input id="search" class="search" placeholder="Например: кавитация, прокладка, затвор"><div id="catalog" class="grid"></div>`;drawCatalog('');$('#search').addEventListener('input',e=>drawCatalog(e.target.value))}
function drawCatalog(query){const q=query.toLowerCase();const list=modules.map((m,i)=>({m,i})).filter(({m})=>JSON.stringify(m).toLowerCase().includes(q));$('#catalog').innerHTML=list.length?list.map(({m:raw,i})=>{const m=cleanModule(raw);return `<article class="card"><span class="pill">Модуль ${i+1} · ${m.hours} акад. ч</span><h2>${m.title}</h2><p>${m.goal}</p><p class="reading">${m.sections.length} разделов · таблица · задача · разбор</p><button onclick="openLesson(${i})">${state.done.includes(i)?'✓ Изучено · открыть':'Изучить модуль'}</button></article>`}).join(''):'<p>Совпадений нет.</p>'}
function table(rows){return `<div class="tablewrap"><table><thead><tr>${rows[0].map(t=>`<th scope="col">${t}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(row=>`<tr>${row.map(t=>`<td>${t}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function openLesson(i){activeModule=i;current='modules';$('#nav').innerHTML=pages.map(([k,t])=>`<button data-page="${k}" class="${k===current?'active':''}">${t}</button>`).join('');const m=cleanModule(modules[i]);$('#title').textContent=modules[i].title;$('#view').innerHTML=`<div class="lesson"><div class="actions" style="margin:0 0 18px"><button class="secondary" onclick="nav('modules')">← Все модули</button><button class="secondary" onclick="window.print()">Печать урока</button><button class="secondary" onclick="showAll()">Весь учебник</button><button class="secondary" onclick="editorIndex=activeModule;nav('editor')">✎ Изменить главу</button></div><div class="card"><span class="pill">Модуль ${i+1} · ${m.hours} акад. ч с практикой</span><h2>Цель</h2><p>${m.goal}</p><div class="toc">${m.sections.map((s,j)=>`<a href="#section-${j}">${j+1}. ${s[0]}</a>`).join('')}<a href="#task">Практика</a></div></div>${m.sections.map((s,j)=>`<section id="section-${j}" class="card section"><div class="eyebrow">Раздел ${j+1}</div><h2>${s[0]}</h2><p>${s[1]}</p></section>`).join('')}${lessonVisual(i)}<div class="card"><h2>Инженерная памятка</h2>${table(m.table)}</div><section id="task" class="card section"><h2>Практическое задание</h2><p>${m.task}</p><label for="notes">Ваше решение</label><textarea id="notes" maxlength="15000" placeholder="Гипотезы, исходные данные, проверки, основания и ограничения…">${escapeHTML(state.notes[i]||'')}</textarea><div class="actions"><button id="save-notes">Сохранить ответ</button><span id="save-status" role="status"></span></div><details><summary>Показать разбор и критерии ответа</summary><p style="margin-top:14px">${m.answer}</p></details></section><div class="card"><h2>Проверьте себя</h2><ol>${m.checks.map(t=>`<li>${t}</li>`).join('')}</ol>${lessonSources(i)}<div class="notice">Отвечайте с обоснованием. Самостоятельная отметка не означает, что навык проверен наставником.</div><div class="actions"><button onclick="toggleDone(${i})">${state.done.includes function calc(){$('#view').innerHTML=`<div class="grid"><form class="card" id="calc-form"><h2>Предварительный расчёт жидкости</h2><div class="field"><label for="q">Расход Q, м³/ч</label><input id="q" type="number" step="any" min="0.000001" required value="25"></div><div class="field"><label for="dp">Перепад на клапане Δp, бар</label><input id="dp" type="number" step="any" min="0.000001" required value="1"></div><div class="field"><label for="sg">Относительная плотность SG</label><input id="sg" type="number" step="any" min="0.000001" required value="1"></div><button>Рассчитать</button></form><div class="card"><h2>Результат</h2><div id="calc-result" aria-live="polite">Введите исходные данные.</div><p style="margin-top:20px">Kv = Q × √(SG / Δp)</p><p class="muted">SG — безразмерное отношение плотности жидкости к плотности воды.</p></div></div><div class="notice">Не применять для газа и пара. Упрощённая оценка не учитывает вязкостные поправки, кавитацию, вскипание, ограничение расхода и влияние обвязки. Расчётное Kv не является окончательным Kvs или выбором DN.</div>`;$('#calc-form').addEventListener('submit',e=>{e.preventDefault();const v=requiredKv(Number($('#q').value),Number($('#dp').value),Number($('#sg').value));$('#calc-result').innerHTML=v===null?'Проверьте данные: требуются конечные положительные числа.':`<div class="stat">Kv = ${v.toLocaleString('ru-RU',{maximumFractionDigits:3})}</div><p>Предварительная потребность в пропускной способности.</p>`})}

let qi=0,score=0,locked=false;

function showQuestion(){locked=false;const q=questions[qi];$('#view').innerHTML=`<div class="card"><span class="pill">Вопрос ${qi+1} из ${questions.length}</span><div class="bar"><span style="width:${qi/questions.length*100}%"></span></div><h2>${q[0]}</h2>${q[1].map((o,i)=>`<button class="option" onclick="answerQuiz(${i})">${o}</button>`).join('')}<div id="feedback" aria-live="polite"></div></div><p class="muted">Это короткая учебная самопроверка, а не аттестационный экзамен.</p>`}
