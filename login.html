<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — АРМАТУРА / PRO</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body class="auth">
<main>
  <div class="auth-brand">
    <a class="mark" href="index.html">АРМАТУРА <span>/ PRO</span></a>
    <p>Учебная система · доступ по приглашению</p>
  </div>
  <div id="app"><div class="card"><p>Загрузка…</p></div></div>
  <p class="auth-foot"><a href="index.html">← Вернуться к учебнику</a></p>
</main>
<script src="js/config.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script>
(() => {
  const app = document.querySelector('#app');
  const next = new URLSearchParams(location.search).get('next') || '';
  // Разрешаем переход только внутри сайта.
  const target = /^[a-z0-9/_-]*$/i.test(next) ? next : '';

  app.innerHTML = `<div class="card">
    <h1>Вход в учебную систему</h1>
    <p class="lead">Введите рабочий email и пароль, которые выдал администратор обучения.</p>
    <form id="form">
      <div class="field">
        <label for="email">Рабочий email</label>
        <input id="email" type="email" required autocomplete="username" placeholder="name@company.ru" autofocus>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" type="password" required autocomplete="current-password">
      </div>
      <p id="status" class="notice" role="status" hidden></p>
      <button type="submit" id="submit">Войти</button>
    </form>
    <p class="links"><a href="reset.html?mode=request">Забыли пароль?</a><a href="admin/diag.html">Проверка доступа</a></p>
    <p class="hint">Свободной регистрации нет: учётные записи создаёт администратор обучения.
      Если письмо с приглашением не пришло — проверьте папку «Спам» или обратитесь к администратору.</p>
  </div>`;

  const form = document.querySelector('#form');
  const status = document.querySelector('#status');
  const button = document.querySelector('#submit');

  function show(text, kind) {
    status.hidden = false;
    status.className = 'notice' + (kind ? ' ' + kind : '');
    status.textContent = text;
  }

  function hide() {
    status.hidden = true;
    status.textContent = '';
  }

  function message(error) {
    const text = String((error && error.message) || '');
    if (/invalid login credentials/i.test(text)) return 'Неверный email или пароль.';
    if (/email not confirmed/i.test(text)) return 'Адрес не подтверждён. Откройте ссылку из письма или обратитесь к администратору.';
    if (/failed to fetch|network|load failed/i.test(text)) return 'Нет связи с сервером. Проверьте интернет и попробуйте снова.';
    if (/too many requests|rate limit/i.test(text)) return 'Слишком много попыток входа. Подождите несколько минут.';
    return text || 'Не удалось войти. Попробуйте ещё раз.';
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const email = document.querySelector('#email').value.trim();
    const password = document.querySelector('#password').value;
    if (!email || !password) {
      show('Заполните email и пароль.', 'err');
      (!email ? document.querySelector('#email') : document.querySelector('#password')).focus();
      return;
    }

    hide();
    button.disabled = true;
    button.textContent = 'Проверяем…';
    try {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { show(message(error), 'err'); return; }

      const { data: userData } = await sb.auth.getUser();
      const user = userData && userData.user;
      // select('*') — страница не падает, если схема профиля в базе отличается.
      const { data: profile, error: profileError } = await sb
        .from('profiles').select('*').eq('id', user ? user.id : '').maybeSingle();

      if (profileError) {
        await sb.auth.signOut();
        show('Вход выполнен, но профиль недоступен: ' + profileError.message, 'err');
        return;
      }
      if (!profile) {
        await sb.auth.signOut();
        show('Профиль не найден. Обратитесь к администратору обучения — учётную запись нужно создать заново.', 'err');
        return;
      }
      if (profile.is_blocked) {
        await sb.auth.signOut();
        show('Учётная запись заблокирована. Обратитесь к администратору обучения.', 'err');
        return;
      }
      if (target.startsWith('admin') && !['admin', 'teacher'].includes(profile.role)) {
        show('У вас нет прав администратора или наставника. Ваша роль: ' + (profile.role || 'не задана') + '.', 'err');
        status.insertAdjacentHTML('beforeend', ' <a href="admin/diag.html">Проверка доступа</a>.');
        return;
      }

      button.textContent = 'Вход выполнен…';
      location.replace(target || (['admin', 'teacher'].includes(profile.role) ? 'admin/' : 'index.html'));
    } catch (error) {
      show(message(error), 'err');
    } finally {
      button.disabled = false;
      if (button.textContent === 'Проверяем…') button.textContent = 'Войти';
    }
  });
})();
</script>
</body></html>
