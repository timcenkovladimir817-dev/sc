<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — АРМАТУРА / PRO</title>
<link rel="stylesheet" href="css/style.css">
<style>
.login{max-width:430px;margin:40px auto}.field{margin-bottom:14px}
label{display:block;font-weight:600;margin-bottom:5px}
input{width:100%;padding:11px;border:1px solid #bbc9de;border-radius:9px;font:inherit}
button{width:100%;padding:12px;border:0;border-radius:9px;background:#315de0;color:#fff;font:inherit;cursor:pointer}
.notice{border-left:4px solid #d5a242;background:#fff7e5;padding:14px 18px;margin:16px 0;font-size:14px}
.ok{border-left-color:#16926a;background:#eaf7ee}.err{border-left-color:#c0392b;background:#fff0ed}
small{color:#65738a}a{color:#315de0}
</style></head>
<body><div class="layout"><main id="app"><div class="login"><p>Загрузка…</p></div></main></div>
<script src="js/config.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script>
(() => {
  const app = document.querySelector('#app');
  const next = new URLSearchParams(location.search).get('next') || '';
  // Разрешаем переход только внутри сайта.
  const target = /^[a-z0-9/_-]*$/i.test(next) ? next : '';
  app.innerHTML = `<div class="login">
    <h1>Вход в учебную систему</h1>
    <div class="card">
      <form id="form">
        <div class="field"><label for="email">Рабочий email</label><input id="email" type="email" required autocomplete="username"></div>
        <div class="field"><label for="password">Пароль</label><input id="password" type="password" required autocomplete="current-password"></div>
        <button type="submit" id="submit">Войти</button>
      </form>
      <p id="status" role="status"></p>
      <p><a href="reset.html?mode=request">Забыли пароль?</a></p>
      <p><small>Регистрация только по приглашению администратора обучения. Если вы не получили письмо — обратитесь к нему.</small></p>
    </div>
    <p><a href="index.html">← Вернуться к учебнику</a></p>
  </div>`;

  document.querySelector('#form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const status = document.querySelector('#status');
    const button = document.querySelector('#submit');
    status.className = ''; status.textContent = 'Проверяем…';
    button.disabled = true;
    const { error } = await sb.auth.signInWithPassword({
      email: document.querySelector('#email').value.trim(),
      password: document.querySelector('#password').value,
    });
    button.disabled = false;
    if (error) {
      status.className = 'notice err';
      status.textContent = /invalid login credentials/i.test(error.message)
        ? 'Неверный email или пароль.'
        : /email not confirmed/i.test(error.message)
          ? 'Подтвердите адрес по ссылке из письма.'
          : error.message;
      return;
    }
    const { data: profile } = await sb.from('profiles').select('role, is_blocked').eq('id', (await sb.auth.getUser()).data.user.id).single();
    if (profile?.is_blocked) {
      await sb.auth.signOut();
      status.className = 'notice err';
      status.textContent = 'Учётная запись заблокирована. Обратитесь к администратору обучения.';
      return;
    }
    location.replace(target || (profile?.role === 'admin' ? 'admin/' : 'index.html'));
  });
})();
</script></body></html>
