<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Прогресс обучения — АРМАТУРА / PRO</title>
<link rel="stylesheet" href="css/style.css">
<style>
.field{margin-bottom:14px}label{display:block;font-weight:600;margin-bottom:5px}
input{width:100%;padding:10px;border:1px solid #bbc9de;border-radius:9px;font:inherit}
button{padding:11px 18px;border:0;border-radius:9px;background:#315de0;color:#fff;font:inherit;cursor:pointer}
.progress{height:14px;background:#e4ebf5;border-radius:10px;overflow:hidden;margin:8px 0 18px}
.progress span{display:block;height:100%;background:#315de0}
.big{font-size:38px;font-weight:700}.muted{color:#65738a}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;border-bottom:1px solid #dce4ef;text-align:left}
.notice{border-left:4px solid #d5a242;background:#fff7e5;padding:14px 18px;margin:16px 0;font-size:14px}
</style></head>
<body><div class="layout"><main id="app"><p>Загрузка…</p></main></div>
<script src="js/config.js"></script>
<script src="js/vendor/supabase.js"></script>
<script>
(async () => {
  const app = document.querySelector('#app');
  const token = new URLSearchParams(location.search).get('token');
  const anon = supabase.createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey);
  if (token && !/^[0-9a-f]{48}$/i.test(token)) { app.innerHTML = '<div class="notice">Некорректная ссылка.</div>'; return; }
  if (!token) {
    app.innerHTML = `<h1>Прогресс обучения</h1><div class="card"><p>Введите код из ссылки, которую передал администратор обучения.</p>
    <form id="f"><div class="field"><label for="t">Код доступа</label><input id="t" required minlength="48" maxlength="48" autocomplete="off"></div>
    <button type="submit">Показать прогресс</button></form></div>`;
    document.querySelector('#f').addEventListener('submit', (e) => { e.preventDefault(); location.href = '?token=' + document.querySelector('#t').value.trim(); });
    return;
  }
  const { data, error } = await anon.rpc('progress_by_token', { p_token: token });
  if (error) { app.innerHTML = '<div class="notice">Не удалось получить данные: ' + esc(error.message) + '</div>'; return; }
  if (!data || !data.length) { app.innerHTML = '<div class="notice">Ссылка недействительна, отозвана или срок её действия истёк. Запросите новую у администратора обучения.</div>'; return; }
  const row = data[0];
  const modules = Array.isArray(row.modules) ? row.modules : [];
  const average = modules.length ? Math.round(modules.reduce((n, m) => n + Number(m.percent || 0), 0) / modules.length) : Number(row.progress || 0);
  app.innerHTML = `
    <div class="eyebrow">Наблюдение за обучением</div>
    <h1>${esc(row.full_name || 'Сотрудник')}</h1>
    <div class="card">
      <p class="muted">Курс: ${esc(row.course_title)}</p>
      <div class="big">${esc(average)}%</div>
      <div class="progress"><span style="width:${Math.max(0, Math.min(100, average))}%"></span></div>
      <p>Статус: <b>${esc(statusText(row.status))}</b>${row.due_date ? ' · срок: <b>' + esc(row.due_date) + '</b>' : ''}</p>
      <p class="muted">Наставник: ${esc(row.mentor_email || 'не указан')} · Руководитель: ${esc(row.supervisor_email || 'не указан')}</p>
    </div>
    <div class="card"><h2>Пройденные модули</h2>
      ${modules.length ? `<div class="tablewrap"><table><thead><tr><th>Модуль</th><th>Прогресс</th><th>Обновлено</th></tr></thead><tbody>${modules.map((m) => `<tr><td>${esc(moduleLabel(m.slug))}</td><td>${esc(m.percent)}%</td><td>${esc(formatDate(m.updated_at))}</td></tr>`).join('')}</tbody></table></div>` : '<p>Модули ещё не начаты.</p>'}
    </div>
    <p class="muted">Данные обновляются при каждой загрузке страницы. Ссылка действует ограниченное время и не даёт доступа к личному кабинету.</p>`;

  function statusText(value) { return ({ assigned: 'назначен', in_progress: 'в процессе', completed: 'завершён', cancelled: 'отменён' })[value] ?? value; }
  function moduleLabel(slug) { return /^\d{2}$/.test(slug) ? 'Модуль ' + Number(slug) : slug; }
  function formatDate(value) { return value ? new Date(value).toLocaleString('ru-RU') : '—'; }
  function esc(value) { return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
})();
</script></body></html>
